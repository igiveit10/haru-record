/* ═══════════ 사진 ═══════════ */
const b64bytes = src => Math.round((src.length - (src.indexOf(",") + 1)) * 0.75);
const stateBytes = () => { try { return new Blob([JSON.stringify(S)]).size; } catch(e){ return JSON.stringify(S).length; } };
const mb = n => (n / 1048576).toFixed(n < 1048576 ? 2 : 1) + "MB";
const MAX_BYTES = 13 * 1048576;
function shrinkImage(file){
  return new Promise(resolve => {
    if(!file || !/^image\//.test(file.type)) return resolve(null);
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const MAX = 1400, scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, h);
      let q = 0.72, src = c.toDataURL("image/jpeg", q);
      while(b64bytes(src) > 820*1024 && q > 0.34){ q -= 0.12; src = c.toDataURL("image/jpeg", q); }
      URL.revokeObjectURL(url);
      resolve({id:uid(), src, w, h});
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}
async function addDraftShots(files, target){
  const bag = (target === "edit" && noteEdit) ? noteEdit : noteDraft;
  const list = Array.from(files || []).filter(f => /^image\//.test(f.type));
  if(!list.length) return;
  let added = 0, skipped = 0;
  for(const f of list){
    const shot = await shrinkImage(f);
    if(!shot){ skipped++; continue; }
    if(stateBytes() + b64bytes(shot.src) > MAX_BYTES){ skipped++; continue; }
    bag.photos.push(shot); added++;
  }
  if(added) renderDaily();
  if(skipped) toast(skipped + "장은 넣지 못했습니다. 저장 공간이 거의 찼습니다");
}
function dataUriToBlob(src){
  const cut = src.indexOf(","), mime = (src.slice(0,cut).match(/:(.*?);/) || [,"image/jpeg"])[1];
  const bin = atob(src.slice(cut+1)), arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
function openLightbox(pool, id, k){
  const i = pool.findIndex(x => x.id === id);
  if(i < 0) return;
  const box = document.createElement("div");
  box.className = "lightbox";
  box.innerHTML = '<img src="' + pool[i].src + '" alt="사진">'
    + '<div class="lbbar"><span class="cap">' + (k ? labelKo(k) + " · " : "") + (i+1) + '/' + pool.length + '</span>'
    + (downloadsApi ? '<button class="btn" data-a="dl">내려받기</button>' : '')
    + '<button class="btn" data-a="close">닫기</button></div>';
  document.body.appendChild(box);
  const close = () => { box.remove(); document.removeEventListener("keydown", onKey, true); };
  const onKey = e => { if(e.key === "Escape"){ e.stopPropagation(); close(); } };
  document.addEventListener("keydown", onKey, true);
  box.onclick = async e => {
    const a = e.target.dataset && e.target.dataset.a;
    if(a === "close" || e.target === box) close();
    else if(a === "dl" && downloadsApi){
      try { await downloadsApi.save({filename:"하루기록장-" + (k||TODAY) + "-" + (i+1) + ".jpg",
        data: dataUriToBlob(pool[i].src)}); } catch(err){}
    }
  };
}

/* ═══════════ 습관 ═══════════ */
function toggleHabit(k,id){
  const list = logOf(k).slice(), i = list.indexOf(id);
  if(i >= 0) list.splice(i,1); else list.push(id);
  if(list.length) S.habitLog[k] = list; else delete S.habitLog[k];
}
function hStreak(id,k){
  let n = 0, cur = k;
  if(!hasHabit(cur,id)) cur = addDays(cur,-1);
  while(hasHabit(cur,id) && n < 3660){ n++; cur = addDays(cur,-1); }
  return n;
}
function hStrip(id,k){
  let out = "";
  for(let i = 13; i >= 0; i--){
    const dk = addDays(k,-i);
    out += '<i class="' + (hasHabit(dk,id) ? "d" : "") + (i === 0 ? " t" : "") + '"></i>';
  }
  return out;
}
function habitRate(mon){
  const hb = habits(); if(!hb.length) return null;
  const ids = hb.map(x => x.id), last = monthDays(mon);
  let days = 0, done = 0;
  for(let i=1;i<=last;i++){
    const dk = monthKey(mon,i);
    if(dk > TODAY) break;
    days++; done += logOf(dk).filter(id => ids.indexOf(id) >= 0).length;
  }
  if(!days) return null;
  const total = days * hb.length;
  return {days, done, total, pct: Math.round(done/total*100)};
}
/* ── 선 그래프 ── */
function lineChart(rows, series, opts){
  const W = 640, H = opts && opts.h ? opts.h : 96, PADT = 8, PADB = 14;
  const pick = (r, sr) => (r && r.vals ? r.vals[sr.key] : r ? r[sr.key] : null);
  const vals = [];
  series.forEach(sr => rows.forEach(r => { const v = pick(r, sr); if(v != null) vals.push(v); }));
  if(!vals.length) return '<div class="chartnone"><span class="empty">아직 값이 없습니다.</span></div>';
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if(hi === lo){ hi = lo + 1; lo = lo - 1; }
  const pad = (hi - lo) * 0.12;
  lo -= pad; hi += pad;
  const n = rows.length;
  const x = i => n === 1 ? W / 2 : (i / (n - 1)) * (W - 8) + 4;
  const y = v => PADT + (1 - (v - lo) / (hi - lo)) * (H - PADT - PADB);
  let g = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img">';
  [0, .5, 1].forEach(t => {
    const yy = PADT + t * (H - PADT - PADB);
    g += '<line x1="0" y1="' + yy.toFixed(1) + '" x2="' + W + '" y2="' + yy.toFixed(1) + '" class="cgrid"/>';
  });
  series.forEach(sr => {
    const pts = rows.map((r,i) => {
      const v = pick(r, sr);
      return v == null ? null : [x(i), y(v)];
    }).filter(Boolean);
    if(!pts.length) return;
    g += '<polyline class="cline ' + sr.cls + '" points="'
      + pts.map(pt => pt[0].toFixed(1) + ',' + pt[1].toFixed(1)).join(" ") + '"/>';
    pts.forEach(pt => { g += '<circle class="cdot ' + sr.cls + '" cx="' + pt[0].toFixed(1)
      + '" cy="' + pt[1].toFixed(1) + '" r="2.4"/>'; });
  });
  g += '</svg>';
  const dec = opts && typeof opts.dec === "number" ? opts.dec : 0;
  return '<div class="chartwrap"><div class="cscale"><span>' + fmtNum(hi, dec)
    + '</span><span>' + fmtNum(lo, dec) + '</span></div>' + g
    + '<div class="cxlab"><span>' + shortKo(rows[0].k) + '</span><span>'
    + shortKo(rows[rows.length-1].k) + '</span></div></div>';
}

    } else if(d.pick !== null){
      const q = HB_QUICK[d.pick];
      h += '<div class="hbfrow"><span class="hblbl"></span><span class="hbhint">'
        + esc(q.fields.map(f => (f.label ? f.label + " " : "") + (f.unit || "값")).join(" · "))
        + ' 칸이 만들어집니다</span></div>';
    } else {
      h += '<div class="hbfrow"><span class="hblbl"></span>'
        + '<span class="hbhint">위에서 항목을 고르거나 수동 입력으로 칸을 만드세요.</span></div>';
    }
  }
  return h + '</div>';
}

function renderHabitTab(){
  const hb = habits();
  const [rFrom, rTo] = rangeOf();
  const days = Math.round((fromKey(rTo) - fromKey(rFrom)) / 86400000) + 1;
  const met = numHabits();
  const wide = days > 62;

  const chkHtml = hb.map(h => {
    let cells = "", dn = 0, dd = 0;
    if(wide){
      const months = [];
      let cur = rFrom.slice(0,7);
      while(cur <= rTo.slice(0,7)){
        const last = monthDays(cur);
        let a2 = 0, b2 = 0;
        for(let i=1;i<=last;i++){
          const dk = monthKey(cur,i);
          if(dk < rFrom || dk > rTo || dk > TODAY) continue;
          b2++; if(hasHabit(dk,h.id)) a2++;
        }
        if(b2) months.push({m:cur, pct: Math.round(a2/b2*100)});
        dn += a2; dd += b2;
        const [yy,mm] = cur.split("-").map(Number);
        const dt = new Date(yy, mm, 1);
        cur = dt.getFullYear() + "-" + pad(dt.getMonth()+1);
      }
      cells = '<div class="mbars">' + months.map(x =>
        '<div class="mbar" title="' + x.m + ' ' + x.pct + '%"><span style="height:' + x.pct + '%"></span>'
        + '<i>' + Number(x.m.slice(5,7)) + '</i></div>').join("") + '</div>';
    } else {
      let cs = "";
      for(let i = 0; i < days; i++){
        const dk = addDays(rFrom, i), on = hasHabit(dk, h.id);
        if(dk <= TODAY){ dd++; if(on) dn++; }
        cs += '<i class="' + (on ? "d" : "") + (dk > TODAY ? " o" : "") + (dk === TODAY ? " t" : "")
          + '" title="' + dk + '"></i>';
      }
      cells = '<span class="hcells" style="grid-template-columns:repeat(' + days + ',1fr)">' + cs + '</span>';
    }
    return '<div class="hbcard"><div class="hbtop">'
      + '<span class="hbttl">' + esc(h.name) + '</span>'
      + (h.fields.length ? '<span class="tag kindtag">수치 ' + h.fields.length + '칸</span>' : '')
      + '<span class="sp"></span>'
      + '<span class="hbnum">연속 ' + hStreak(h.id, TODAY) + '일</span>'
      + '<span class="hbnum">' + (dd ? Math.round(dn/dd*100) : 0) + '%</span>'
      + '<button class="hbdel" data-a="ren" data-h="' + h.id + '" title="이름 바꾸기">' + SVG_PEN + '</button>'
      + '<button class="hbdel" data-a="del" data-h="' + h.id + '" title="지우기">&times;</button></div>'
      + cells + '</div>';
  }).join("");

  const cols = ["c1","c2","c3","c4"];
  const metHtml = met.map(h => {
    const rows = metricSeries(h, rFrom, rTo);
    const stats = h.fields.map((f,i) => {
      const V = rows.map(r => r.vals[i]).filter(v => v !== null);
      const last = rows.slice().reverse().find(r => r.vals[i] !== null);
      const avg = V.length ? V.reduce((x,y) => x+y, 0) / V.length : null;
      const nm = f.label || (h.fields.length > 1 ? (i+1) + "번" : "값");
      return '<span class="stat"><em>' + esc(nm) + '</em> 최근 <b>'
        + (last ? fmtNum(last.vals[i], f.dec || 0) : "–") + '</b>'
        + (f.unit ? ' <em>' + esc(f.unit) + '</em>' : '')
        + ' · 평균 <b>' + fmtNum(avg, f.dec || 0) + '</b>'
        + (V.length ? ' · <b>' + fmtNum(Math.min.apply(null,V), f.dec || 0) + '–'
            + fmtNum(Math.max.apply(null,V), f.dec || 0) + '</b>' : '') + '</span>';
    }).join("");
    const chart = lineChart(rows, h.fields.map((f,i) => ({key:i, cls:cols[i % 4]})),
      {dec: h.fields[0].dec || 0, h: h.fields.length > 1 ? 110 : 96});
    const legend = h.fields.length > 1
      ? '<div class="clegend">' + h.fields.map((f,i) => '<span class="' + cols[i % 4] + '">'
          + esc(f.label || ((i+1) + "번")) + '</span>').join("") + '</div>' : '';
    return '<div class="hbcard"><div class="hbtop">'
      + '<span class="hbttl">' + esc(h.name) + '</span>'
      + '<span class="tag kindtag">' + esc(h.fields.map(f => f.unit || "값").join(" · "))
      + '</span><span class="sp"></span>'
      + '<span class="hbnum">기록 ' + rows.length + '일</span></div>'
      + '<div class="hbstats">' + stats + '</div>' + chart + legend + '</div>';
  }).join("");

  $("view").innerHTML =
      '<div class="panel"><div class="ph"><h3>기록 보기</h3>'
    + '<span class="sp"></span><span class="hint2">습관 ' + hb.length + '개 · 그중 수치 ' + met.length + '개</span>'
    + '<button class="btn primary" id="hb-new" style="padding:4px 12px;font-size:12.5px">+ 새 습관</button></div>'
    + '<div class="segbar" style="border-top:0"><div class="seg2" id="hb-range">'
    + [["month","이 달"],["3m","3개월"],["6m","6개월"],["all","전체"]].map(o =>
        '<button data-v="' + o[0] + '" aria-pressed="' + (S.view.hbRange === o[0] ? "true" : "false")
        + '">' + o[1] + '</button>').join("")
    + '</div>'
    + (S.view.hbRange === "month"
        ? '<div class="hnavm"><button class="nav" data-a="mprev">&#8249;</button>'
          + '<b>' + S.view.month.replace("-", ".") + '</b>'
          + '<button class="nav" data-a="mnext">&#8250;</button></div>' : '')
    + '<span class="sp"></span><span class="lbl">' + shortKo(rFrom) + ' – ' + shortKo(rTo)
    + ' · ' + days + '일' + (wide ? ' · 월별 달성률' : '') + '</span></div>'
    + (hb.length ? chkHtml
        : '<div class="gnone"><span class="empty">아직 등록한 습관이 없습니다. 오른쪽 위 <b>+ 새 습관</b>을 눌러 보세요.</span></div>')
    + '</div>'

    + (met.length ? '<div class="panel" style="margin-top:16px">'
        + '<div class="ph"><h3>수치 추이</h3><span class="sp"></span>'
        + '<span class="hint2">' + shortKo(rFrom) + ' – ' + shortKo(rTo) + '</span></div>'
        + metHtml + '</div>' : '');

  bindHabitTab();
}

function bindHabitForm(root, draw, add){
  const d = hbDraft;
  const grab = () => {
    const n = root.querySelector("#hb-name"); if(n) d.name = n.value;
    root.querySelectorAll(".hbform .ffld").forEach(inp => {
      const i = Number(inp.dataset.i);
      if(d.fields[i]) d.fields[i][inp.dataset.p] = inp.value;
    });
  };
  const numBox = root.querySelector("#hb-num");
  if(numBox) numBox.onchange = () => { grab(); d.num = numBox.checked; if(!d.num) d.pick = null; draw(); };
  root.querySelectorAll(".hbquick button").forEach(b => b.onclick = () => {
    grab();
    if(b.dataset.q === "manual"){
      if(d.pick !== "manual") d.fields = [blankField()];
      d.pick = "manual";
    } else {
      const q = HB_QUICK[Number(b.dataset.q)];
      d.pick = Number(b.dataset.q);
      d.fields = q.fields.map(f => Object.assign({custom:false}, f));
      if(!(d.name || "").trim()) d.name = q.name;
    }
    draw();
  });
  const cnt = root.querySelector("#hb-cnt");
  if(cnt) cnt.querySelectorAll("button").forEach(b => b.onclick = () => {
    grab();
    const n = Number(b.dataset.n);
    while(d.fields.length < n) d.fields.push(blankField());
    d.fields = d.fields.slice(0, n);
    draw();
  });
  root.querySelectorAll(".hbform .usel").forEach(sel => {
    sel.onchange = () => {
      grab();
      const i = Number(sel.dataset.i);
      if(!d.fields[i]) return;
      if(sel.value === "__custom"){ d.fields[i].custom = true; d.fields[i].unit = ""; }
      else { d.fields[i].custom = false; d.fields[i].unit = sel.value; }
      draw();
    };
  });
  root.querySelectorAll('.pick[data-dec]').forEach(pk => {
    const i = Number(pk.dataset.dec);
    pk.querySelectorAll("button").forEach(b => b.onclick = () => {
      grab(); if(d.fields[i]) d.fields[i].dec = Number(b.dataset.n); draw();
    });
  });
  root.querySelectorAll('.hbform input[type="text"]').forEach(inp => {
    inp.oninput = grab;
    inp.onkeydown = e => { if(composing(e)) return; if(e.key === "Enter"){ e.preventDefault(); add(); } };
  });
  return grab;
}

function openHabitModal(){
  if($("scrim")) return;
  hbDraft = blankDraft();
  const scrim = document.createElement("div");
  scrim.className = "scrim"; scrim.id = "scrim";
  const close = () => { scrim.remove(); document.removeEventListener("keydown", onKey, true); };
  const onKey = e => { if(e.key === "Escape"){ e.stopPropagation(); close(); } };
  let grab = () => {};
  const add = () => {
    grab();
    const d = hbDraft;
    const name = (d.name || "").trim();
    if(!name){ const n = scrim.querySelector("#hb-name"); if(n) n.focus(); return; }
    if(habits().some(h => h.name === name)){ toast("같은 이름의 습관이 이미 있습니다"); return; }
    let fields = [];
    if(d.num){
      if(d.pick === null){ toast("기록 항목을 골라 주세요"); return; }
      fields = d.fields.map(f => ({label:(f.label||"").trim(), unit:(f.unit||"").trim(),
                                   dec: f.dec != null ? f.dec : 0}));
    }
    habits().push({id:uid(), name, fields});
    hbDraft = blankDraft();
    touch(); close(); render();
    toast('"' + name + '" 습관을 추가했습니다');
  };
  const draw = () => {
    scrim.innerHTML = '<div class="modal wide" role="dialog" aria-modal="true">'
      + '<div class="mdhead"><h4>새 습관</h4><span class="sp"></span>'
      + '<span class="hbhint">했다 / 안 했다 체크가 기본입니다</span></div>'
      + habitForm()
      + '<div class="mdfoot"><span class="sp"></span>'
      + '<button class="btn" id="hb-cancel">취소</button>'
      + '<button class="btn primary" id="hb-add">추가</button></div></div>';
    grab = bindHabitForm(scrim, draw, add);
    scrim.querySelector("#hb-cancel").onclick = close;
    scrim.querySelector("#hb-add").onclick = add;
    const n = scrim.querySelector("#hb-name"); if(n) n.focus();
  };
  const openedAt = Date.now();
  scrim.onclick = e => { if(e.target === scrim && Date.now() - openedAt > 350) close(); };
  document.addEventListener("keydown", onKey, true);
  document.body.appendChild(scrim);
  draw();
}

function bindHabitTab(){
  const view = $("view");
  const nb = view.querySelector("#hb-new");
  if(nb) nb.onclick = openHabitModal;

  view.querySelectorAll("#hb-range button").forEach(b => b.onclick = () => {
    S.view.hbRange = b.dataset.v; touch(); renderHabitTab();
  });
  view.querySelectorAll('.hnavm [data-a]').forEach(b => b.onclick = () => {
    const [y,m] = S.view.month.split("-").map(Number);
    const dt = new Date(y, m - 1 + (b.dataset.a === "mnext" ? 1 : -1), 1);
    S.view.month = dt.getFullYear() + "-" + pad(dt.getMonth()+1);
    touch(); renderHabitTab();
  });
  view.querySelectorAll(".hbdel").forEach(b => {
    b.onclick = () => {
      const id = b.dataset.h, h = habits().find(x => x.id === id);
      if(!h) return;
      if(b.dataset.a === "ren"){
        const v = prompt("습관 이름을 바꿉니다.", h.name);
        if(v == null) return;
        const nn = v.trim(); if(!nn) return;
        h.name = nn; touch(); renderHabitTab(); return;
      }
      if(!confirm('"' + h.name + '" 습관과 지금까지의 기록을 모두 지웁니다. 계속할까요?')) return;
      S.habits = habits().filter(x => x.id !== id);
      Object.keys(S.habitLog).forEach(dk => {
        const left = logOf(dk).filter(x => x !== id);
        if(left.length) S.habitLog[dk] = left; else delete S.habitLog[dk];
      });
      Object.keys(S.metrics).forEach(dk => {
        if(S.metrics[dk][id] !== undefined) delete S.metrics[dk][id];
        if(!Object.keys(S.metrics[dk]).length) delete S.metrics[dk];
      });
      touch(); renderHabitTab(); renderNav();
    };
  });
}

/* ═══════════ 프로젝트 자동완성 ═══════════ */
/* 입력창에서 '[' 를 치면 등록된 프로젝트를 아래에 띄운다. 무시하고 쓰면 새 프로젝트가 된다. */
function attachProjectAC(input, getCat){
  const wrap = document.createElement("span");
  wrap.className = "acwrap";
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  let box = null, list = [], idx = -1;

  const close = () => { if(box){ box.remove(); box = null; } list = []; idx = -1; };
  const ctx = () => {
    const pos = input.selectionStart == null ? input.value.length : input.selectionStart;
    const before = input.value.slice(0, pos);
    const i = before.lastIndexOf("[");
    if(i < 0) return null;
    const frag = before.slice(i + 1);
    if(/[\]\n]/.test(frag) || frag.length > 24) return null;
    return {i, frag, pos};
  };
  const paint = () => {
    const c = ctx();
    if(!c){ close(); return; }
    const q = c.frag.trim().toLowerCase();
    const cat = getCat ? getCat() : null;
    const names = allProjectNames();
    list = names.map(n => findProject(n) || {name:n, cat:"업무"})
      .filter(p => !q || p.name.toLowerCase().indexOf(q) >= 0)
      .sort((a,b) => {
        if(cat && (a.cat === cat) !== (b.cat === cat)) return a.cat === cat ? -1 : 1;
        return a.name.localeCompare(b.name, "ko");
      }).slice(0, 12);
    if(idx >= list.length) idx = list.length - 1;
    if(!box){
      box = document.createElement("div");
      box.className = "acbox";
      wrap.appendChild(box);
    }
    box.className = "acbox" + (list.length ? "" : " empty");
    box.innerHTML = list.map((p,i) =>
        '<button type="button" class="acitem' + (i === idx ? " on" : "") + '" data-n="' + esc(p.name) + '">'
        + '<span class="nm">' + esc(p.name) + '</span><span class="ct">' + p.cat + '</span></button>').join("")
      + '<div class="achint">' + (list.length ? "&#8593;&#8595; 고르고 Enter · " : "")
      + "그냥 이어서 쓰면 새 프로젝트가 됩니다</div>";
    box.querySelectorAll(".acitem").forEach(b => {
      b.onmousedown = e => { e.preventDefault(); pick(b.dataset.n); };
    });
  };
  const pick = name => {
    const c = ctx(); if(!c) { close(); return; }
    const after = input.value.slice(c.pos);
    const head = input.value.slice(0, c.i) + "[" + name + "] ";
    input.value = head + after.replace(/^\s*\]\s*/, "");
    const at = head.length;
    try { input.setSelectionRange(at, at); } catch(e){}
    close();
    input.dispatchEvent(new Event("input"));
    input.focus();
  };
  input.addEventListener("input", () => setTimeout(paint, 0));
  input.addEventListener("click", () => setTimeout(paint, 0));
  input.addEventListener("blur", () => setTimeout(close, 140));
  return {
    close,
    key(e){
      if(!box) return false;
      if(e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); close(); return true; }
      if(e.key === "ArrowDown" || e.key === "ArrowUp"){
        if(!list.length) return false;
        e.preventDefault();
        idx = e.key === "ArrowDown"
          ? (idx + 1 >= list.length ? 0 : idx + 1)
          : (idx - 1 < 0 ? list.length - 1 : idx - 1);
        paint();
        return true;
      }
      if(e.key === "Enter" && idx >= 0 && list[idx]){
        e.preventDefault(); e.stopPropagation();
        pick(list[idx].name);
        return true;
      }
      return false;
    }
  };
}

      + '</div></div>'
      + '<div class="pdsum">'
      + (st.first ? '<span class="stat">시작 <b>' + shortKo(st.first) + '</b></span>'
          + '<span class="stat">최근 <b>' + shortKo(st.last) + '</b></span>'
          : '<span class="stat">아직 이 프로젝트로 적은 항목이 없습니다</span>')
      + '<span class="stat">항목 <b>' + done + '/' + total + '</b></span>'
      + '<span class="stat">시간 <b>' + hm(st.mins) + '</b></span>'
      + '<span class="stat">기록 <b>' + st.notes.length + '</b></span>'
      + (d.due ? '<span class="stat">목표까지 <b class="' + (dDays(d.due) < 0 && !d.done ? "late" : "")
          + '">' + dLabel(d.due) + '</b></span>' : '')
      + '<div class="pbar" style="width:100%"><span style="width:' + pct + '%"></span></div>'
      + '<span style="width:100%;text-align:right">완료 ' + pct + '%</span>'
      + '</div></div>'
      + '<div class="mdfoot">'
      + (isNew ? '' : '<button class="btn" id="pm-del">프로젝트 지우기</button>')
      + '<span class="sp"></span><button class="btn" id="pm-cancel">취소</button>'
      + '<button class="btn primary" id="pm-save">' + (isNew ? "만들기" : "저장") + '</button></div></div>';
    wire();
  };
  const grab = () => {
    const n1 = $("pm-name"); if(n1) d.name = n1.value;
    const du = $("pm-due"); if(du) d.due = du.value;
  };
  const wire = () => {
    scrim.querySelectorAll("#pm-cat button").forEach(b => b.onclick = () => { grab(); d.cat = b.dataset.c; draw(); });
    scrim.querySelectorAll("#pm-done button").forEach(b => b.onclick = () => { grab(); d.done = b.dataset.v === "1"; draw(); });
    scrim.querySelectorAll("#pm-color button").forEach(b => b.onclick = () => { grab(); d.color = Number(b.dataset.i); draw(); });
    $("pm-due").onchange = () => { grab(); draw(); };
    $("pm-due-clear").onclick = () => { d.due = ""; draw(); };
    $("pm-name").onkeydown = e => { if(composing(e)) return; if(e.key === "Enter"){ e.preventDefault(); save(); } };
    $("pm-cancel").onclick = close;
    $("pm-save").onclick = save;
    const delBtn = $("pm-del");
    if(delBtn) delBtn.onclick = () => { grab(); mode = "delete"; scope = "keep"; draw(); };
  };
  let settled = false;
  const close = () => {
    scrim.remove(); document.removeEventListener("keydown", onKey, true);
    if(isNew && !settled){
      S.projects = projects().filter(x => x.name !== orig);
      touch(); render();
    }
  };
  const onKey = e => { if(e.key === "Escape"){ e.stopPropagation(); close(); } };
  const save = () => {
    grab();
    const nn = (d.name || "").trim().replace(/[\[\]()]/g, "");
    if(!nn){ toast("이름을 적어 주세요"); return; }
    if(nn !== orig && findProject(nn)){ toast("이미 있는 이름입니다"); return; }
    const cur = findProject(orig);
    if(!cur){ close(); return; }
    if(nn !== orig) renameProject(orig, nn);
    const p2 = findProject(nn) || cur;
    p2.cat = d.cat; p2.color = d.color; p2.done = d.done;
    if(d.due) p2.due = d.due; else delete p2.due;
    settled = true;
    touch(); close(); render();
    toast(isNew ? '"' + nn + '" 프로젝트를 만들었습니다' : "프로젝트를 저장했습니다");
  };
  const openedAt = Date.now();
  scrim.onclick = e => { if(e.target === scrim && Date.now() - openedAt > 350) close(); };
  document.addEventListener("keydown", onKey, true);
  document.body.appendChild(scrim);
  draw();
  setTimeout(() => { const n2 = $("pm-name"); if(n2) n2.focus(); }, 10);
}

function renderProjects(){
  const fc = S.view.prjCat || "전체";
  const all = allProjectNames().map(n => {
    const p = findProject(n) || {name:n, cat:"업무"};
    const st = projectStats(n);
    return {name:n, cat:p.cat, st, due: p.due || null, done: prjDone(n, st)};
  }).filter(r => fc === "전체" || r.cat === fc);

  let gFirst = null, gLast = null;
  all.forEach(r => {
    if(r.st.first && (!gFirst || r.st.first < gFirst)) gFirst = r.st.first;
    if(r.st.last && (!gLast || r.st.last > gLast)) gLast = r.st.last;
    if(r.due && (!gLast || r.due > gLast)) gLast = r.due;
  });
  if(!gFirst){ gFirst = monthKey(S.view.month, 1); gLast = monthKey(S.view.month, monthDays(S.view.month)); }
  gFirst = gFirst.slice(0,7) + "-01";
  gLast = gLast.slice(0,7) + "-" + pad(monthDays(gLast.slice(0,7)));

  const opts = {monthTicks:true, wide:true, notes:true, actions:true, maxSubs:12};
  const live0 = all.filter(r => !r.done)
    .sort((a,b) => (b.st.last||"").localeCompare(a.st.last||"") || a.name.localeCompare(b.name,"ko"));
  const fin = all.filter(r => r.done)
    .sort((a,b) => (b.st.last||"").localeCompare(a.st.last||"") || a.name.localeCompare(b.name,"ko"));

  const block = (rows, emptyMsg, extra) => rows.length
    ? ganttBlock(rows, gFirst, gLast, Object.assign({}, opts, extra || {}))
    : '<div class="gnone"><span class="empty">' + emptyMsg + '</span></div>';

  $("view").innerHTML =
      '<div class="panel"><div class="ph"><h3>프로젝트</h3><span class="sp"></span>'
    + '<span class="hint2">이름을 누르면 관리 · 진한 칸 = 지난 구간 · 옅은 칸 = 예정 · 붉은 선 = 오늘</span></div>'
    + '<div class="segbar" style="border-top:0"><div class="seg2" id="pj-cat">'
    + ["전체","업무","개인"].map(c => '<button data-v="' + c + '" class="' + (c === "개인" ? "cat-p" : "")
        + '" aria-pressed="' + (fc === c ? "true" : "false") + '">' + c + '</button>').join("")
    + '</div><span class="sp"></span><div class="pick" id="pj-new-cat">'
    + CATS.map(c => '<button class="' + catCls(c) + '" data-c="' + c + '" aria-pressed="'
        + (c === "업무" ? "true" : "false") + '">' + c + '</button>').join("")
    + '</div><input type="text" class="f" id="pj-name" placeholder="새 프로젝트 이름" maxlength="24" style="width:170px">'
    + '<button class="btn primary" id="pj-add">추가</button></div></div>'

    + '<div class="panel" style="margin-top:16px"><div class="ph"><h3>진행 중인 프로젝트</h3>'
    + '<span class="sp"></span><span class="hint2">' + live0.length + '개</span></div>'
    + block(live0, "진행 중인 프로젝트가 없습니다.") + '</div>'

    + '<div class="panel" style="margin-top:16px"><div class="ph"><h3>완료된 프로젝트</h3>'
    + '<span class="sp"></span><span class="hint2">'
    + (fin.length ? '눌러서 펼치기 · ' : '') + fin.length + '개</span></div>'
    + block(fin, "완료된 프로젝트가 없습니다.", {collapsible:true}) + '</div>';

  const view = $("view");
  view.querySelectorAll(".ggroup").forEach(g => {
    const nm = g.querySelector(".gline").dataset.p;
    if(fin.some(r => r.name === nm)) g.classList.add("finished");
  });
  view.querySelectorAll("#pj-cat button").forEach(b => b.onclick = () => {
    S.view.prjCat = b.dataset.v; touch(); render();
  });
  let newCat2 = "업무";
  view.querySelectorAll("#pj-new-cat button").forEach(b => b.onclick = () => {
    newCat2 = b.dataset.c;
    view.querySelectorAll("#pj-new-cat button").forEach(x =>
      x.setAttribute("aria-pressed", x.dataset.c === newCat2 ? "true" : "false"));
  });
  const addPj = () => {
    const el = $("pj-name"), name = el.value.trim().replace(/[\[\]()]/g, "");
    if(!name){ el.focus(); return; }
    if(findProject(name)){ toast("이미 있는 프로젝트입니다"); return; }
    projects().push({id:uid(), name, cat:newCat2, color: projects().length % 8});
    el.value = "";
    touch(); render();
    openProjectModal(name, true);
  };
  $("pj-add").onclick = addPj;
  $("pj-name").onkeydown = e => { if(composing(e)) return; if(e.key === "Enter"){ e.preventDefault(); addPj(); } };

  view.querySelectorAll(".gsub[data-k]").forEach(g => g.onclick = () => select(g.dataset.k, "day"));
  view.querySelectorAll(".gline[data-p] .gnmtxt").forEach(nm => {
    nm.onclick = e => {
      e.stopPropagation();
      const name = nm.closest(".gline").dataset.p;
      if(!findProject(name)) projects().push({id:uid(), name, cat:"업무", color: projects().length % 8});
      openProjectModal(name);
    };
  });
  view.querySelectorAll(".ggroup.foldable .gline").forEach(g => {
    g.onclick = e => {
      if(e.target.closest(".gnmtxt") || e.target.closest(".gact")) return;
      const grp = g.closest(".ggroup"), name = g.dataset.p;
      const shut = grp.classList.toggle("collapsed");
      if(shut) prjOpen.delete(name); else prjOpen.add(name);
    };
  });
  view.querySelectorAll(".gline[data-p]").forEach(g => {
    const name = g.dataset.p;
    const own = () => {
      let p = findProject(name);
      if(!p){ p = {id:uid(), name, cat:"업무", color: projects().length % 8}; projects().push(p); }
      return p;
    };
    g.querySelectorAll(".gact button").forEach(b => {
      b.onclick = e => {
        e.stopPropagation();
        const a = b.dataset.a;
        if(a === "edit"){ own(); openProjectModal(name); return; }
        if(a === "done"){ const p = own(); p.done = !prjDone(name); }
        touch(); render();
      };
    });
  });
}

/* ═══════════ 주간 ═══════════ */
const PX_HW = 30;
function wkCat(){ return S.view.wkCat || "전체"; }
function wkView(){ return S.view.wkView || "time"; }
function catOK(it){ const f = wkCat(); return f === "전체" || it.cat === f; }
const durMin = it => it.allDay ? 0 : Math.max(30, toMin(it.end || it.start) - toMin(it.start));
function hm(mins){
  const h = Math.floor(mins/60), m = mins%60;
  return (h ? h + "시간" : "") + (m ? (h ? " " : "") + m + "분" : (h ? "" : "0분"));
}
function taskGroup(title){ return projectOf(title) || "미분류"; }

function renderWeekly(){
  const days = weekDays(S.view.selected), hb = habits(), met = numHabits();
  const view = wkView(), fcat = wkCat();
  const [from, to] = gridRange();

  /* 집계 */
  let evN = 0, mins = 0, ntN = 0, hbDone = 0, hbSlots = 0, movedN = 0, doneN = 0;
  const perDayMin = {}, byGroup = {}, byCat = {"업무":0, "개인":0}, ntKind = {};
  days.forEach(dk => {
    perDayMin[dk] = 0;
    itemsOn(dk).forEach(o => {
      const it = o.it;
      if(!live(it) || o.span || !catOK(it)) return;
      evN++;
      if(it.status === "moved") movedN++;
      if(it.status === "done") doneN++;
      const d = durMin(it);
      mins += d; perDayMin[dk] += d;
      byCat[it.cat] = (byCat[it.cat] || 0) + d;
      const g = taskGroup(it.title);
      byGroup[g] = (byGroup[g] || 0) + d;
    });
    notesOn(dk).forEach(n => {
      if(fcat !== "전체" && n.cat !== fcat) return;
      ntN++; ntKind[n.kind] = (ntKind[n.kind] || 0) + 1;
    });
    if(dk <= TODAY){ hbSlots += hb.length; hbDone += logOf(dk).filter(id => hb.some(x => x.id === id)).length; }
  });
  const hbPct = hbSlots ? Math.round(hbDone/hbSlots*100) : null;

  /* 머리 */
  let head = '<div class="wtghead"><span></span>';
  days.forEach(dk => {
    const d = fromKey(dk), hol = holiday(dk), c = ["wtgd","s"+d.getDay()];
    if(hol) c.push("hol");
    if(dk === TODAY) c.push("today");
    if(dk === S.view.selected) c.push("sel");
    head += '<button class="' + c.join(" ") + '" data-k="' + dk + '" title="' + esc(hol || labelKo(dk)) + '">'
      + '<i>' + DOW[d.getDay()] + '</i><b>' + d.getDate() + '</b></button>';
  });
  head += '</div>';

  let body = "";
  if(view === "time"){
    /* 종일 줄 */
    let ad = '<div class="wtgall"><span class="lb">종일</span>';
    days.forEach(dk => {
      ad += '<div class="wtgacell" data-k="' + dk + '">';
      itemsOn(dk).forEach(o => {
        const it = o.it;
        if(!it.allDay || !live(it) || !catOK(it)) return;
        ad += '<span class="adchip ' + catCls(it.cat) + ' ' + it.kind + ' ' + it.status
          + '" data-ok="' + o.ok + '" data-id="' + it.id + '"><span>' + esc(it.title) + '</span></span>';
      });
      ad += '</div>';
    });
    ad += '</div>';

    let hours = '<div class="wtghours">';
    for(let h = from; h <= to; h++){
      const {ap, n} = hourLabel(h);
      hours += '<div class="wtghour" style="height:' + PX_HW + 'px">'
        + ((h === from || h === 12) ? '<span class="ap">' + ap + '</span>' : '') + '<b>' + n + '</b></div>';
    }
    hours += '</div>';

    const top0 = from * 60, gh = (to - from + 1) * PX_HW;
    const nowMin = new Date().getHours()*60 + new Date().getMinutes();
    let cols = '<div class="wtgcols" id="wtgcols">';
    days.forEach(dk => {
      const timed = itemsOn(dk).filter(o => !o.it.allDay && live(o.it) && catOK(o.it) && !o.span);
      const packed = packTimed(timed);
      let inner = "";
      packed.forEach(x => {
        const it = x.o.it;
        const t = (x.s - top0) / 60 * PX_HW;
        const hgt = Math.max(15, (x.e - x.s) / 60 * PX_HW - 1);
        const w = 100 / x.cols, l = x.col * w;
        inner += '<div class="wtgitem ' + catCls(it.cat) + ' ' + it.kind + ' ' + it.status
          + '" data-ok="' + x.o.ok + '" data-id="' + it.id + '" data-k="' + dk + '"'
          + ' style="top:' + t.toFixed(1) + 'px;height:' + hgt.toFixed(1) + 'px;'
          + 'left:calc(' + l + '% + 2px);width:calc(' + w + '% - 4px)" title="'
          + esc(it.start + "–" + it.end + " " + it.title) + '">'
          + (hgt >= 26 ? '<b>' + it.start + '</b>' : '')
          + '<span>' + esc(it.title) + '</span></div>';
      });
      const nl = (dk === TODAY && nowMin >= top0 && nowMin <= (to+1)*60)
        ? '<div class="wtgnow" style="top:' + ((nowMin-top0)/60*PX_HW).toFixed(1) + 'px"></div>' : '';
      cols += '<div class="wtgcol' + (dk === TODAY ? " today" : "") + '" data-k="' + dk + '"'
        + ' style="height:' + gh + 'px">' + nl + inner + '</div>';
    });
    cols += '</div>';
    body = ad + '<div class="wtgwrap">' + hours + cols + '</div>';
  } else {
    body = '<div class="wlist">';
    days.forEach(dk => {
      const d = fromKey(dk), hol = holiday(dk);
      const list = itemsOn(dk).filter(o => live(o.it) && catOK(o.it) && !o.span)
        .sort((a,b) => (a.it.allDay ? "" : a.it.start) < (b.it.allDay ? "" : b.it.start) ? -1 : 1);
      const dm = perDayMin[dk] || 0;
      body += '<div class="wlday s' + d.getDay() + (hol ? " hol" : "") + '">'
        + '<b>' + shortKo(dk) + '</b><i>' + DOW[d.getDay()] + (hol ? " · " + esc(hol) : "") + '</i>'
        + '<span class="sp"></span><em>' + (list.length ? list.length + "건" : "") + (dm ? " · " + hm(dm) : "") + '</em></div>';
      if(!list.length) body += '<div class="wlnone"><span class="empty">비어 있습니다.</span></div>';
      list.forEach(o => {
        const it = o.it;
        body += '<div class="wlrow ' + it.status + '" data-ok="' + o.ok + '" data-id="' + it.id + '">'
          + '<span class="wltime">' + (it.allDay ? "종일" : it.start + "–" + it.end) + '</span>'
          + '<span class="tag ' + catCls(it.cat) + '">' + it.cat + '</span>'
          + (it.kind === "task" ? '<span class="tag kindtag">할일</span>' : '')
          + '<span class="txt">' + esc(it.title) + '</span></div>';
      });
    });
    body += '</div>';
  }

  /* 습관 격자 */
  let hbRows = "";
  if(hb.length || met.length){
    hbRows = '<div class="wksep">습관</div>'
      + hb.map(x =>
        '<div class="wkrow"><span class="wklb" title="' + esc(x.name) + '">' + esc(x.name) + '</span>'
        + days.map(dk => '<button class="wkchk' + (hasHabit(dk,x.id) ? " on" : "") + (dk > TODAY ? " future" : "")
            + '" data-h="' + x.id + '" data-k="' + dk + '" role="checkbox" aria-checked="'
            + (hasHabit(dk,x.id)?"true":"false") + '" aria-label="' + esc(x.name) + ' ' + labelKo(dk)
            + '"><span>' + SVG_CHECK + '</span></button>').join("") + '</div>').join("")
      + met.map(x =>
        '<div class="wkrow"><span class="wklb sub" title="' + esc(x.name) + ' 수치">'
        + esc(x.name) + ' 값</span>'
        + days.map(dk => {
            const v = metVals(dk, x.id);
            const parts = x.fields.map((f,i) => {
              const n = Number(v[i]);
              return isFinite(n) ? fmtNum(n, f.dec || 0) : null;
            }).filter(z => z !== null);
            return '<span class="wkcell ' + (parts.length ? "" : "zero")
              + '" style="font-size:11px">' + (parts.length ? parts.join("/") : "·") + '</span>';
          }).join("") + '</div>').join("");
  }

  const seg = (id, opts, cur, extra) => '<div class="seg2" id="' + id + '">'
    + opts.map(o => '<button data-v="' + o[0] + '" class="' + (extra && o[0] === "개인" ? "cat-p" : "")
        + '" aria-pressed="' + (cur === o[0] ? "true" : "false") + '">' + o[1] + '</button>').join("") + '</div>';

  $("view").innerHTML =
      '<div class="panel"><div class="ph"><h3>주간 진행</h3><span class="sp"></span>'
    + '<span class="hint2">' + labelKo(days[0]) + ' – ' + labelKo(days[6]) + '</span></div>'
    + '<div class="segbar">'
    + seg("wk-view", [["time","시간별로 보기"],["list","리스트로 보기"]], view)
    + seg("wk-cat", [["전체","전체"],["업무","업무"],["개인","개인"]], fcat, true)
    + '<span class="sp"></span>'
    + '<span class="lbl">일정 ' + evN + ' · ' + hm(mins) + ' · 기록 ' + ntN + '건'
    + (hbPct !== null ? ' · 습관 ' + hbPct + '%' : '') + '</span></div>'
    + head + body + hbRows + '</div>'
    + reviewPanel(days, {evN, mins, ntN, hbPct, movedN, doneN, perDayMin, byGroup, byCat, ntKind, hb});

  bindWeekly(days);
}

function bindWeekly(days){
  const view = $("view"), [from, to] = gridRange();
  view.querySelectorAll("#wk-view button").forEach(b => b.onclick = () => {
    S.view.wkView = b.dataset.v; touch(); renderWeekly();
  });
  view.querySelectorAll("#wk-cat button").forEach(b => b.onclick = () => {
    S.view.wkCat = b.dataset.v; touch(); renderWeekly();
  });
  view.querySelectorAll(".wtgd").forEach(b => b.onclick = () => select(b.dataset.k, "day"));
  view.querySelectorAll(".wkchk").forEach(b => b.onclick = () => {
    toggleHabit(b.dataset.k, b.dataset.h); touch(); renderWeekly(); renderMini();
  });

  /* 빈 칸 클릭 → 새 항목 */
  view.querySelectorAll(".wtgcol").forEach(col => {
    col.onclick = e => {
      if(e.target !== col) return;
      const r = col.getBoundingClientRect();
      const min = Math.round(((e.clientY - r.top) / PX_HW * 60 + from * 60) / 30) * 30;
      openItemModal(col.dataset.k, null, null, {start: toHM(min), end: toHM(min + 60)});
    };
  });
  view.querySelectorAll(".wtgacell").forEach(cell => {
    cell.onclick = e => {
      if(e.target !== cell) return;
      openItemModal(cell.dataset.k, null, null, {allDay:true});
    };
  });

  /* 항목: 수정 / 메뉴 / 드래그(요일·시간 동시 이동) */
  view.querySelectorAll(".wtgitem, .adchip, .wlrow").forEach(el => {
    const ok = el.dataset.ok, id = el.dataset.id;
    bindItemActions(el, ok, id);
    if(!el.classList.contains("wtgitem")) return;
    el.onpointerdown = e => {
      if(e.button !== 0) return;
      const it = findItem(ok, id); if(!it || it.allDay) return;
      const cols = $("wtgcols"), colRect = cols.getBoundingClientRect();
      const colW = colRect.width / 7;
      const startX = e.clientX, startY = e.clientY;
      const orig = toMin(it.start), dur = durMin(it);
      const origIdx = days.indexOf(el.dataset.k);
      const top0 = from * 60;
      let moved = false, ns = orig, idx = origIdx;
      try { el.setPointerCapture(e.pointerId); } catch(err){}
      const label = el.querySelector("b");
      const onMove = ev => {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if(!moved && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
        moved = true; el._dragged = true; el.classList.add("dragging");
        ns = Math.max(top0, Math.min((to + 1) * 60 - dur,
          orig + Math.round(dy / PX_HW * 60 / 15) * 15));
        idx = Math.max(0, Math.min(6, origIdx + Math.round(dx / colW)));
        el.style.top = ((ns - top0) / 60 * PX_HW).toFixed(1) + "px";
        el.style.transform = "translateX(" + ((idx - origIdx) * colW).toFixed(1) + "px)";
        if(label) label.textContent = toHM(ns);
      };
      const onUp = () => {
        el.onpointermove = null; el.onpointerup = null; el.onpointercancel = null;
        el.classList.remove("dragging"); el.style.transform = "";
        if(!moved) return;
        clickGuardUntil = Date.now() + 400;
        const cur = findItem(ok, id); if(!cur) return;
        cur.start = toHM(ns); cur.end = toHM(ns + dur);
        const target = days[idx];
        if(target !== el.dataset.k) moveItemTo(ok, id, target);
        else cur.endDate = ok;
        touch(); renderWeekly();
      };
      el.onpointermove = onMove; el.onpointerup = onUp; el.onpointercancel = onUp;
    };
  });
  bindReview(days);
}

/* ── 주간 돌아보기 ── */
function reviewPanel(days, a){
  const groups = Object.keys(a.byGroup).filter(g => a.byGroup[g] > 0)
    .sort((x,y) => a.byGroup[y] - a.byGroup[x]).slice(0, 6);
  const maxG = groups.length ? a.byGroup[groups[0]] : 1;
  const bars = groups.map(g =>
    '<div class="bar"><span class="nm" title="' + esc(g) + '">' + esc(g) + '</span>'
    + '<span class="track"><span class="fill" style="width:' + Math.round(a.byGroup[g]/maxG*100) + '%"></span></span>'
    + '<span class="val">' + hm(a.byGroup[g]) + '</span></div>').join("");

  const busiest = days.slice().sort((x,y) => (a.perDayMin[y]||0) - (a.perDayMin[x]||0))[0];
  const lightest = days.filter(d => d <= TODAY).sort((x,y) => (a.perDayMin[x]||0) - (a.perDayMin[y]||0))[0];
  const wm = a.byCat["업무"] || 0, pm = a.byCat["개인"] || 0, tm = wm + pm;
  const kinds = Object.keys(a.ntKind).sort((x,y) => a.ntKind[y] - a.ntKind[x]).slice(0,3);

  const lines = [];
  if(a.evN) lines.push('일정 <b>' + a.evN + '건</b>에 <b>' + hm(a.mins) + '</b>을 썼습니다.'
    + (tm ? ' 업무 <b>' + (tm ? Math.round(wm/tm*100) : 0) + '%</b> · 개인 <b>' + (tm ? Math.round(pm/tm*100) : 0) + '%</b>.' : ''));
  else lines.push('이번 주에 잡힌 일정이 없습니다.');
  if(groups.length) lines.push('가장 많은 시간을 쓴 곳은 <b>' + esc(groups[0]) + '</b>('
    + hm(a.byGroup[groups[0]]) + ')입니다.');
  if(busiest && a.perDayMin[busiest]) lines.push('가장 바빴던 날은 <b>' + labelKo(busiest) + ' '
    + DOW[fromKey(busiest).getDay()] + '요일</b>('
    + hm(a.perDayMin[busiest]) + ')이고, 가장 여유로웠던 날은 <b>' + labelKo(lightest) + '</b>입니다.');
  if(a.ntN) lines.push('기록은 <b>' + a.ntN + '건</b>'
    + (kinds.length ? ' — ' + kinds.map(x => esc(x) + ' ' + a.ntKind[x]).join(' · ') : '') + '.');
  if(a.movedN) lines.push('<b>' + a.movedN + '건</b>은 다음으로 미뤘습니다.');
  if(a.hbPct !== null) lines.push('습관은 <b>' + a.hbPct + '%</b> 지켰습니다.');

  return '<div class="panel" style="margin-top:16px"><div class="ph"><h3>주간 돌아보기</h3>'
    + '<span class="sp"></span><span class="hint2">제목 앞 [프로젝트] 기준으로 묶습니다</span></div>'
    + '<div class="rvw">'
    + '<p class="rvwline">' + lines.join(" ") + '</p>'
    + (bars ? '<div><p class="rvwsub">과제별 시간</p><div class="bars">' + bars + '</div></div>' : '')
    + '<div class="rvwbtns"><span class="lbl" style="font-size:11px;color:var(--ink-3)">'
    + 'Claude에게 회고와 주간업무보고 초안을 부탁할 자료입니다</span><span class="sp"></span>'
    + '<button class="btn" id="rv-toggle">자료 보기</button>'
    + '<button class="btn" id="rv-copy">복사</button>'
    + '<button class="btn primary" id="rv-dl" hidden>내려받기</button></div>'
    + '<textarea class="promptbox" id="rv-text" readonly hidden></textarea>'
    + '</div></div>';
}

function reviewPrompt(days){
  const fcat = wkCat();
  const L = [];
  L.push(fromKey(days[0]).getFullYear() + "년 " + weekNo(days[0]) + "주차 주간 기록 ("
    + labelKo(days[0]) + " ~ " + labelKo(days[6]) + ")"
    + (fcat !== "전체" ? " — " + fcat + "만" : ""));
  L.push("");
  L.push("## 일정");
  let any = false;
  days.forEach(dk => {
    const list = itemsOn(dk).filter(o => live(o.it) && catOK(o.it) && !o.span)
      .sort((a,b) => (a.it.allDay ? "" : a.it.start) < (b.it.allDay ? "" : b.it.start) ? -1 : 1);
    if(!list.length) return;
    any = true;
    L.push("- " + shortKo(dk) + "(" + DOW[fromKey(dk).getDay()] + ")");
    list.forEach(o => {
      const it = o.it;
      L.push("  - " + (it.allDay ? "종일" : it.start + "-" + it.end)
        + " [" + it.cat + (it.kind === "task" ? "/할일" : "") + "] " + it.title
        + (it.status !== "open" ? " (" + ({done:"완료",moved:"연기",deleted:"삭제"}[it.status] || it.status) + ")" : ""));
    });
  });
  if(!any) L.push("- 없음");
  L.push("");
  L.push("## 기록사항");
  let anyN = false;
  days.forEach(dk => {
    notesOn(dk).forEach(n => {
      if(fcat !== "전체" && n.cat !== fcat) return;
      anyN = true;
      L.push("- " + shortKo(dk) + " [" + n.cat + "/" + n.kind + "] "
        + (n.text || "").replace(/\s*\n\s*/g, " / ").slice(0, 400));
    });
  });
  if(!anyN) L.push("- 없음");
  const hb = habits();
  if(hb.length){
    L.push("");
    L.push("## 습관");
    hb.forEach(x => {
      const done = days.filter(dk => dk <= TODAY && hasHabit(dk, x.id)).length;
      const past = days.filter(dk => dk <= TODAY).length;
      L.push("- " + x.name + ": " + done + "/" + past);
    });
  }
  L.push("");
  L.push("---");
  L.push("위 기록을 바탕으로 답해 주세요.");
  L.push("1. 이번 주를 어떻게 보냈는지 3~4문장으로 짚어 주세요. 기록사항의 내용도 함께 읽어 주세요.");
  L.push("2. 업무를 과제 단위로 묶어 주간업무보고 초안을 만들어 주세요.");
  L.push("   과제마다 [과제명 / 이번 주 진행한 일 / 남은 일 / 다음 주 계획] 형식으로요.");
  L.push("3. 시간을 잘 쓴 부분과 아쉬운 부분을 각각 한두 가지만 짚어 주세요.");
  return L.join("\n");
}

function bindReview(days){
  const box = $("rv-text"), tg = $("rv-toggle");
  if(!box) return;
  box.value = reviewPrompt(days);
  tg.onclick = () => {
    box.hidden = !box.hidden;
    tg.textContent = box.hidden ? "자료 보기" : "자료 접기";
    if(!box.hidden) box.scrollIntoView({block:"nearest"});
  };
  $("rv-copy").onclick = async () => {
    const text = box.value;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch(e){}
    if(!ok){
      box.hidden = false; tg.textContent = "자료 접기";
      box.focus(); box.select();
      try { ok = document.execCommand("copy"); } catch(e){}
    }
    toast(ok ? "자료를 복사했습니다. Claude에 붙여넣어 보세요" : "복사가 막혀 있습니다. 아래 상자에서 직접 복사해 주세요");
  };
  const dl = $("rv-dl");
  if(downloadsApi){
    dl.hidden = false;
    dl.onclick = async () => {
      try { await downloadsApi.save({filename:"주간기록-" + days[0] + ".md", data: box.value}); } catch(e){}
    };
  }
}

/* ═══════════ 월간 ═══════════ */
function prjColorIdx(name){
  const p = findProject(name);
  if(p && typeof p.color === "number") return p.color % 8;
  let h = 0;
  for(let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return h % 8;
}
const prjClass = name => name ? ("pc" + prjColorIdx(name)) : "pcx";
const stripPrj = t => (t || "").replace(/^[\[(]\s*[^\])\n]{1,24}\s*[\])]\s*/, "");

const MAX_LANES = 4;
const prjOpen = new Set();   /* 펼쳐 둔 완료 프로젝트 */

/* 프로젝트 타임라인 (월간 사이드바 · 프로젝트 탭 공용) */
const dayNo = k => Math.round((fromKey(k) - new Date(2000,0,1)) / 86400000);
function ganttBlock(rows, rFrom, rTo, opts){
  opts = opts || {};
  const f0 = dayNo(rFrom), span = dayNo(rTo) - f0 + 1;
  const pct = k => (dayNo(k) - f0) / span * 100;
  const nowPct = (TODAY >= rFrom && TODAY <= rTo) ? pct(TODAY) + (100 / span) : null;
  const track = (a, b, extra, due) => {
    const s0 = a < rFrom ? rFrom : a, e0 = b > rTo ? rTo : b;
    const L = pct(s0), W = Math.max(1.2, pct(e0) + (100 / span) - L);
    const base = (extra || []).slice();
    if(a < rFrom) base.push("oL");
    if(b > rTo) base.push("oR");
    let inner = "";
    if(base.indexOf("dotted") >= 0){
      inner = '<span class="gbar ' + base.join(" ") + '" style="left:' + L.toFixed(2)
        + '%;width:' + W.toFixed(2) + '%"></span>';
    } else {
      /* 전체 구간은 옅게(예정), 오늘까지 지난 구간만 진하게 */
      inner = '<span class="gbar gplan ' + base.join(" ") + '" style="left:' + L.toFixed(2)
        + '%;width:' + W.toFixed(2) + '%"></span>';
      if(s0 <= TODAY){
        const pe = e0 < TODAY ? e0 : TODAY;
        const W2 = Math.max(1.2, pct(pe) + (100 / span) - L);
        const b2 = base.filter(c => c !== "oR");
        if(e0 <= TODAY && base.indexOf("oR") >= 0) b2.push("oR");
        inner += '<span class="gbar greal ' + b2.join(" ") + '" style="left:' + L.toFixed(2)
          + '%;width:' + W2.toFixed(2) + '%"></span>';
      }
    }
    if(due && due >= rFrom && due <= rTo){
      inner += '<span class="gdue" style="left:' + pct(due).toFixed(2) + '%" title="목표 '
        + shortKo(due) + '"></span>';
    }
    if(nowPct !== null) inner += '<span class="gnow" style="left:' + nowPct.toFixed(2) + '%"></span>';
    return '<span class="gtrack">' + inner + '</span>';
  };
  /* 아직 아무 항목도 없는 프로젝트 */
  const emptyTrack = due => {
    let inner = "";
    if(due && due >= rFrom && due <= rTo)
      inner += '<span class="gdue" style="left:' + pct(due).toFixed(2) + '%" title="목표 '
        + shortKo(due) + '"></span>';
    if(nowPct !== null) inner += '<span class="gnow" style="left:' + nowPct.toFixed(2) + '%"></span>';
    return '<span class="gtrack">' + inner + '</span>';
  };
  let ticks = "";
  if(opts.monthTicks){
    const marks = [];
    let cur = rFrom.slice(0,7);
    while(cur <= rTo.slice(0,7)){
      const at = (dayNo(cur + "-01") - f0) / span * 100;
      if(at >= -1) marks.push({at: Math.max(0, at), label: Number(cur.slice(5,7)) + "월"});
      const [yy,mm] = cur.split("-").map(Number);
      const d = new Date(yy, mm, 1);
      cur = d.getFullYear() + "-" + pad(d.getMonth() + 1);
    }
    const step = marks.length > 10 ? Math.ceil(marks.length / 8) : 1;
    ticks = '<div class="gticks"><span class="gnm"></span><span class="gtrack tickline">'
      + marks.filter((_,i) => i % step === 0)
        .map(t => '<span class="gtick" style="left:' + t.at.toFixed(2) + '%">' + t.label + '</span>').join("")
      + '</span><span class="gspan">기간</span>'
      + (opts.actions ? '<span class="gact ghost"></span>' : '') + '</div>';
  } else {
    const lastD = Number(rTo.slice(8));
    ticks = '<div class="gticks"><span class="gnm"></span><span class="gtrack"><span>1</span>'
      + '<span>' + Math.round(lastD/2) + '</span><span>' + lastD + '</span></span>'
      + '<span class="gspan">기간</span>'
      + (opts.actions ? '<span class="gact ghost"></span>' : '') + '</div>';
  }

  return '<div class="gantt' + (opts.wide ? " gwide" : "") + '">' + ticks
    + rows.map(r => {
      const subs = r.st.items.map(({k, it}) => ({
          k, it, e: (it.allDay && it.endDate && it.endDate > k) ? it.endDate : k
        })).filter(x => x.k <= rTo && x.e >= rFrom)
        .sort((a,b) => a.k.localeCompare(b.k));
      const notes = opts.notes
        ? r.st.notes.filter(x => x.k >= rFrom && x.k <= rTo).sort((a,b) => a.k.localeCompare(b.k))
        : [];
      const cap = opts.maxSubs || 8;
      const shown = subs.slice(0, cap);
      const nShown = notes.slice(0, cap);
      const foldable = !!opts.collapsible;
      const shut = foldable && !prjOpen.has(r.name);
      return '<div class="ggroup ' + prjClass(r.name) + (foldable ? " foldable" : "")
        + (shut ? " collapsed" : "") + '">'
        + '<div class="gline" data-p="' + esc(r.name) + '">'
        + '<span class="gnm">' + (foldable ? '<i class="gchev">&#9656;</i>' : '')
        + '<i class="gdot"></i><span class="gnmtxt">' + esc(r.name) + '</span></span>'
        + (r.st.first
            ? track(r.st.first, (r.due && r.due > r.st.last) ? r.due : r.st.last, null, r.due)
            : emptyTrack(r.due))
        + '<span class="gspan">'
        + (r.st.first ? shortKo(r.st.first) + '–' + shortKo(r.st.last)
                      : '<span style="color:var(--ink-3)">아직 없음</span>')
        + (r.due ? '<em class="' + (dDays(r.due) < 0 && !r.done ? "late" : "") + '">목표 '
            + shortKo(r.due) + ' · ' + dLabel(r.due) + '</em>' : '') + '</span>'
        + (opts.actions
            ? '<span class="gact">'
              + '<button data-a="done" title="' + (r.done ? "다시 진행 중으로" : "완료로 표시") + '">'
              + SVG_CHECK + '</button>'
              + '<button data-a="edit" title="프로젝트 관리">' + SVG_PEN + '</button></span>'
            : '')
        + '</div>'
        + shown.map(x => '<div class="gsub ' + x.it.status + ' ' + x.it.kind + '" data-k="' + x.k
            + '" title="' + esc(x.it.title) + '">'
            + '<span class="gnm">' + esc(stripPrj(x.it.title) || x.it.title) + '</span>'
            + track(x.k, x.e)
            + '<span class="gspan">' + shortKo(x.k) + (x.e > x.k ? '–' + shortKo(x.e) : '')
            + '</span>' + (opts.actions ? '<span class="gact ghost"></span>' : '') + '</div>').join("")
        + nShown.map(x => '<div class="gsub note" data-k="' + x.k + '" title="' + esc(x.n.text.slice(0,120)) + '">'
            + '<span class="gnm"><i class="gnt"></i>' + esc(x.n.kind) + ' · '
            + esc(stripPrj(x.n.text).replace(/\s*\n\s*/g, " ").slice(0, 40)) + '</span>'
            + track(x.k, x.k, ["dotted"])
            + '<span class="gspan">' + shortKo(x.k) + '</span>'
            + (opts.actions ? '<span class="gact ghost"></span>' : '') + '</div>').join("")
        + ((subs.length > shown.length || notes.length > nShown.length)
            ? '<div class="gmore">그 밖에 '
              + ((subs.length - shown.length) + (notes.length - nShown.length)) + '건</div>' : '')
        + '</div>';
    }).join("") + '</div>';
}

function renderMonthly(){
  const mon = S.view.month;
  const [y,m] = mon.split("-").map(Number);
  const first = new Date(y,m-1,1), start = new Date(first);
  start.setDate(1 - colOffset(first));
  const grid = [];
  for(let i=0;i<42;i++){ const d = new Date(start); d.setDate(start.getDate()+i); grid.push(key(d)); }

  /* 종일 항목 모으기 */
  const spans = [];
  Object.keys(S.items).forEach(k => (S.items[k]||[]).forEach(it => {
    if(!it.allDay || it.status === "deleted") return;
    spans.push({ok:k, it, s:k, e: it.endDate && it.endDate > k ? it.endDate : k});
  }));
  spans.sort((a,b) => a.s < b.s ? -1 : a.s > b.s ? 1 :
    ((b.e > a.e) ? 1 : (b.e < a.e) ? -1 : 0));

  const overflow = {};   /* 날짜별 숨은 개수 */
  let weeks = "";
  for(let w = 0; w < 6; w++){
    const wk = grid.slice(w*7, w*7+7);
    const ws = wk[0], we = wk[6];
    const lanes = [];
    let bars = "";
    spans.forEach(sp => {
      if(sp.e < ws || sp.s > we) return;
      const si = Math.max(0, wk.indexOf(sp.s < ws ? ws : sp.s));
      const ei = Math.min(6, wk.indexOf(sp.e > we ? we : sp.e));
      if(si < 0 || ei < si) return;
      let lane = 0;
      while(lanes[lane] !== undefined && lanes[lane] >= si) lane++;
      lanes[lane] = ei;
      if(lane >= MAX_LANES){
        for(let c = si; c <= ei; c++) overflow[wk[c]] = (overflow[wk[c]] || 0) + 1;
        return;
      }
      const name = projectOf(sp.it.title);
      const cls = ["calbar", prjClass(name), sp.it.kind, sp.it.status];
      if(sp.s < ws) cls.push("contL");
      if(sp.e > we) cls.push("contR");
      bars += '<div class="' + cls.join(" ") + '" data-ok="' + sp.ok + '" data-id="' + sp.it.id + '"'
        + ' style="grid-column:' + (si+1) + '/' + (ei+2) + ';grid-row:' + (lane+1) + '"'
        + ' title="' + esc(sp.it.title + (sp.e > sp.s ? " (" + shortKo(sp.s) + "–" + shortKo(sp.e) + ")" : "")) + '">'
        + esc(sp.s < ws ? sp.it.title : (name ? sp.it.title : sp.it.title)) + '</div>';
    });

    let cells = "";
    wk.forEach(k => {
      const d = fromKey(k), dow = d.getDay(), hol = holiday(k), out = d.getMonth() !== m-1;
      const timed = itemsOn(k).filter(o => live(o.it) && !o.it.allDay && !o.span);
      const nts = notesOn(k).length;
      const cls = ["cell"];
      if(out) cls.push("out");
      if(dow===0) cls.push("sun"); if(dow===6) cls.push("sat");
      if(hol) cls.push("hol");
      if(k===TODAY) cls.push("today");
      if(k===S.view.selected) cls.push("sel");
      let marks = "";
      if(timed.length) marks += '<i class="mk-ev" title="시간 일정 ' + timed.length + '"></i>';
      if(nts) marks += '<i class="mk-nt" title="기록 ' + nts + '"></i>';
      cells += '<button class="' + cls.join(" ") + '" data-k="' + k + '">'
        + '<span class="ctop"><span class="n">' + d.getDate() + '</span>'
        + (hol && !out ? '<span class="holname">' + esc(hol) + '</span>' : "")
        + '<span class="csp"></span><span class="marks">' + marks + '</span></span>'
        + (overflow[k] ? '<span class="calmore">+' + overflow[k] + '</span>' : '')
        + '</button>';
    });
    weeks += '<div class="calweek"><div class="calrow">' + cells + '</div>'
      + '<div class="calbars">' + bars + '</div></div>';
  }

  const lastD = monthDays(mon);

  /* 프로젝트 타임라인 */
  const mFirst = monthKey(mon, 1), mLast = monthKey(mon, lastD);
  const prjRows = allProjectNames().map(n => {
    const p = findProject(n) || {name:n, cat:"업무"};
    const st = projectStats(n);
    return {name:n, cat:p.cat, st, due: p.due || null};
  }).filter(r => r.st.first && r.st.first <= mLast && r.st.last >= mFirst)
    .sort((a,b) => a.st.first.localeCompare(b.st.first) || a.name.localeCompare(b.name, "ko"));

  const ganttOf = cat => {
    const rows = prjRows.filter(r => r.cat === cat);
    if(!rows.length) return '<div class="gnone"><span class="empty">이 달에 움직인 '
      + cat + ' 프로젝트가 없습니다.</span></div>';
    return ganttBlock(rows, mFirst, mLast, {});
  };

  $("view").innerHTML = '<div class="mgrid2"><div class="panel">'
    + '<div class="dow">' + WEEK_COLS.map(i => '<div class="s' + i + '">' + DOW[i] + '</div>').join("") + '</div>'
    + '<div class="cal" id="cal">' + weeks + '</div></div>'
    + '<div class="colstack">'
    + '<div class="panel"><div class="ph"><h3>업무 프로젝트</h3><span class="sp"></span>'
    + '<span class="hint2">' + prjRows.filter(r => r.cat === "업무").length + '개</span></div>'
    + ganttOf("업무") + '</div>'
    + '<div class="panel"><div class="ph"><h3>개인 프로젝트</h3><span class="sp"></span>'

/* ═══════════ NOTE ═══════════ */
function renderNotes(){
  const q = (S.view.q || "").trim();
  const fc = S.view.nfCat, fk = S.view.nfKind;
  const rows = [];
  Object.keys(S.notes).sort().reverse().forEach(k => {
    notesOn(k).slice().reverse().forEach(n => {
      if(fc !== "전체" && n.cat !== fc) return;
      if(fk !== "전체" && n.kind !== fk) return;
      if(q && (n.text||"").toLowerCase().indexOf(q.toLowerCase()) < 0) return;
      rows.push({k, n});
    });
  });
  let total = 0; Object.keys(S.notes).forEach(k => total += notesOn(k).length);

  let body = "", lastMon = "";
  rows.forEach(({k,n}) => {
    const mon = k.slice(0,7);
    if(mon !== lastMon){
      lastMon = mon;
      body += '<div class="ntmonth">' + Number(mon.slice(0,4)) + '년 ' + Number(mon.slice(5,7)) + '월</div>';
    }
    body += '<article class="ntcard" data-k="' + k + '" data-id="' + n.id + '"><div class="nthead">'
      + '<button class="ntdate" data-k="' + k + '">' + k.slice(5).replace("-",".") + ' ' + DOW[fromKey(k).getDay()] + '</button>'
      + '<span class="tag ' + catCls(n.cat) + '">' + n.cat + '</span>'
      + '<span class="tag kindtag">' + esc(n.kind) + '</span><span class="sp"></span>'
      + (n.at ? '<span class="nttime">' + esc(n.at) + '</span>' : '')
      + '<button class="ntrm" data-act="ntedit" aria-label="기록 고치기">' + SVG_PEN + '</button></div>'
      + (n.text ? '<p class="nttext">' + hilite(n.text, q) + '</p>' : '')
      + shotsBlock(n.photos, n.id) + '</article>';
  });

  const chip = (val, cur, attr) => '<button data-' + attr + '="' + val + '" aria-pressed="'
    + (cur === val ? "true" : "false") + '">' + val + '</button>';
  $("view").innerHTML = '<div class="panel">'
    + '<div class="ph"><h3>기록 모아보기</h3><span class="sp"></span>'
    + '<span class="hint2">' + rows.length + ' / ' + total + '건</span></div>'
    + '<div class="ntbar"><div class="pick" id="nf-cat">'
    + ["전체"].concat(CATS).map(c => '<button data-c="' + c + '" aria-pressed="'
        + (fc === c ? "true" : "false") + '">' + c + '</button>').join("") + '</div>'
    + '<div class="kindpick" id="nf-kind">'
    + ["전체"].concat(NOTE_KINDS).map(x => chip(x, fk, "x")).join("") + '</div>'
    + '<span class="sp"></span>'
    + '<input type="text" class="f nsearch" id="nq" placeholder="기록 검색" value="' + esc(q) + '"></div>'
    + '<div class="ntlist">' + (body || '<div class="ntempty"><span class="empty">'
        + (q || fc !== "전체" || fk !== "전체" ? "조건에 맞는 기록이 없습니다." : "일간 화면에서 기록을 남기면 여기에 모입니다.")
        + '</span></div>') + '</div></div>';

  const view = $("view");
  view.querySelectorAll("#nf-cat button").forEach(b => b.onclick = () => { S.view.nfCat = b.dataset.c; renderNotes(); });
  view.querySelectorAll("#nf-kind button").forEach(b => b.onclick = () => { S.view.nfKind = b.dataset.x; renderNotes(); });
  const qi = $("nq");
  qi.oninput = () => {
    S.view.q = qi.value;
    clearTimeout(qi._t); qi._t = setTimeout(() => {
      const pos = qi.selectionStart; renderNotes();
      const el = $("nq"); if(el){ el.focus(); try { el.setSelectionRange(pos,pos); } catch(e){} }
    }, 220);
  };
  qi.onkeydown = e => { if(composing(e)) return; if(e.key === "Escape"){ qi.value = ""; qi.oninput(); } };
  view.querySelectorAll(".ntdate").forEach(b => b.onclick = () => select(b.dataset.k, "day"));
  view.querySelectorAll('.ntcard [data-act="ntedit"]').forEach(b => {
    b.onclick = () => {
      const card = b.closest(".ntcard"), k = card.dataset.k, id = card.dataset.id;
      const n = notesOn(k).find(x => x.id === id); if(!n) return;
      noteEdit = {k, id, cat:n.cat, kind:n.kind, text:n.text, photos:n.photos.slice()};
      select(k, "day");
      const t = $("ne-text"); if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
    };
  });
  view.querySelectorAll(".shot").forEach(el => {
    const card = el.closest(".ntcard"), k = card.dataset.k, nid = card.dataset.id;
    const pool = (notesOn(k).find(x => x.id === nid) || {}).photos || [];
    const open = () => openLightbox(pool, el.dataset.id, k);
    el.onclick = e => { if(e.target.dataset && e.target.dataset.act === "rmshot") return; open(); };
    el.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); open(); } };
    const x = el.querySelector(".x"); if(x) x.remove();
  });
}
function hilite(text, q){
  if(!q) return esc(text);
  return esc(text).split(new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"))
    .map((x,i) => i % 2 ? '<mark>' + x + '</mark>' : x).join("");
}

/* ═══════════ 이동 / 전역 ═══════════ */
function select(k, mode){
  S.view.selected = k; S.view.month = k.slice(0,7);
  if(mode) S.view.mode = mode;
  touch(); render();
}
function shift(n){
  const m = S.view.mode;
  if(m === "day") select(addDays(S.view.selected, n));
  else if(m === "week") select(addDays(S.view.selected, n*7));
  else if(m === "month"){
    const [y,mm] = S.view.month.split("-").map(Number);
    const d = new Date(y, mm-1+n, 1);
    S.view.month = d.getFullYear() + "-" + pad(d.getMonth()+1);
    touch(); render();
  }
}
function setMode(m){ S.view.mode = m; touch(); render(); }
let toastT;
function toast(msg){
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2600);
}

$("prev").onclick = () => shift(-1);

document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea" || tag === "select" || e.metaKey || e.ctrlKey || e.altKey) return;
  if(composing(e) || $("scrim") || $("cmenu") || document.querySelector(".lightbox")) return;
  if(e.key === "ArrowLeft"){ e.preventDefault(); shift(-1); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); shift(1); }
  else if(e.key === "ArrowUp" && S.view.mode === "day"){ e.preventDefault(); select(addDays(S.view.selected,-7)); }
  else if(e.key === "ArrowDown" && S.view.mode === "day"){ e.preventDefault(); select(addDays(S.view.selected,7)); }
  else if(e.key === "t" || e.key === "T"){ select(TODAY, "day"); }
  else if(e.key === "d" || e.key === "D"){ setMode("day"); }
  else if(e.key === "w" || e.key === "W"){ setMode("week"); }
  else if(e.key === "m" || e.key === "M"){ setMode("month"); }
  else if(e.key === "n" || e.key === "N"){ setMode("note"); }
  else if(e.key === "p" || e.key === "P"){ setMode("prj"); }
  else if(e.key === "h" || e.key === "H"){ setMode("habit"); }
});

/* ═══════════ 시각 입력 ═══════════ */
function normTime(v){
  const t = String(v || "").trim();
  if(!t) return "";
  let m = t.match(/^(\d{1,2})\s*[:.]\s*(\d{1,2})$/);
  if(!m){
    const d = t.replace(/\D/g, "");
    if(!d) return "";
    if(d.length <= 2) m = [0, d, "0"];
    else if(d.length === 3) m = [0, d.slice(0,1), d.slice(1)];
    else m = [0, d.slice(0,2), d.slice(2,4)];
  }
  const h = Math.min(23, Math.max(0, parseInt(m[1], 10) || 0));
  const mi = Math.min(59, Math.max(0, parseInt(m[2], 10) || 0));
  return pad(h) + ":" + pad(mi);
}
function timeField(id, value, width){
  return '<span class="tfield" style="width:' + (width || 92) + 'px">'
    + '<input type="text" class="f tinput" id="' + id + '" value="' + esc(value || "")
    + '" placeholder="--:--" inputmode="numeric" maxlength="5" autocomplete="off"></span>';
}
function bindTimeFields(root){
  root.querySelectorAll(".tfield").forEach(fld => {
    if(fld._wired) return;
    fld._wired = true;
    const inp = fld.querySelector(".tinput");
    const opts = [];
    for(let m = 0; m < 24 * 60; m += 15) opts.push(toHM(m));
    let menu = null, idx = -1;

    const place = () => {
      if(!menu) return;
      const r = inp.getBoundingClientRect();
      const below = innerHeight - r.bottom - 12, above = r.top - 12;
      const up = below < 190 && above > below;
      const h = Math.min(300, Math.max(150, up ? above : below));
      const w = Math.max(r.width, 124);
      menu.style.width = w + "px";
      menu.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + "px";
      menu.style.maxHeight = h + "px";
      if(up){ menu.style.top = "auto"; menu.style.bottom = (innerHeight - r.top + 6) + "px"; }
      else { menu.style.bottom = "auto"; menu.style.top = (r.bottom + 6) + "px"; }
    };
    const paint = () => {
      if(!menu) return;
      const cur = normTime(inp.value);
      menu.innerHTML = opts.map((t,i) =>
        '<button type="button" class="topt' + (i === idx ? " on" : "")
          + (t === cur ? " cur" : "") + '" data-t="' + t + '"><b>' + t + '</b></button>').join("");
      menu.querySelectorAll(".topt").forEach(b2 => {
        b2.onmousedown = e => { e.preventDefault(); pick(b2.dataset.t); };
      });
    };
    const onScroll = () => place();
    const onDown = e => { if(menu && !menu.contains(e.target) && e.target !== inp) close(); };
    const open = () => {
      if(menu) return;
      menu = document.createElement("div");
      menu.className = "tmenu";
      document.body.appendChild(menu);
      const want = normTime(inp.value);
      let i0 = opts.indexOf(want);
      if(i0 < 0 && want) i0 = Math.max(0, Math.min(opts.length - 1, Math.round(toMin(want) / 15)));
      idx = Math.max(0, i0);
      paint(); place();
      const cur = menu.querySelector(".topt.cur") || menu.children[idx];
      if(cur) menu.scrollTop = Math.max(0, cur.offsetTop - 90);
      addEventListener("scroll", onScroll, true);
      addEventListener("resize", place);
      addEventListener("pointerdown", onDown, true);
    };
    const close = () => {
      if(!menu) return;
      menu.remove(); menu = null; idx = -1;
      removeEventListener("scroll", onScroll, true);
      removeEventListener("resize", place);
      removeEventListener("pointerdown", onDown, true);
    };
    const commit = v => {
      const before = inp.value;
      inp.value = v;
      if(inp.value !== before) inp.dispatchEvent(new Event("change", {bubbles:true}));
    };
    const pick = t => { commit(t); close(); };

    inp.onfocus = open;
    inp.onclick = open;
    inp.oninput = () => {
      if(!menu) return;
      idx = opts.indexOf(normTime(inp.value));
      paint();
      if(idx >= 0 && menu.children[idx]) menu.children[idx].scrollIntoView({block:"nearest"});
    };
    inp.onblur = () => setTimeout(() => { commit(normTime(inp.value)); close(); }, 120);
    inp.onkeydown = e => {
      if(composing(e)) return;
      if(e.key === "ArrowDown" || e.key === "ArrowUp"){
        e.preventDefault();
        if(!menu){ open(); return; }
        idx = Math.min(opts.length - 1, Math.max(0, idx + (e.key === "ArrowDown" ? 1 : -1)));
        paint();
        const el = menu.children[idx];
        if(el) el.scrollIntoView({block:"nearest"});
      } else if(e.key === "Enter"){
        if(menu && idx >= 0){ e.preventDefault(); e.stopPropagation(); pick(opts[idx]); }
        else { commit(normTime(inp.value)); close(); }
      } else if(e.key === "Escape"){
        if(menu){ e.stopPropagation(); close(); }
      }
    };
  });
}

/* ═══════════ 잠금 · 암호화 ═══════════ */
const LOCK_LS = "haru-lock-v1";
const SUBTLE = (typeof crypto !== "undefined" && crypto.subtle) ? crypto.subtle : null;
let lockCfg = null;      /* {salt, check} */
let cryptoKey = null;    /* CryptoKey (열려 있을 때만) */

const b64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
const ub64 = str => { const b = atob(str), a = new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) a[i] = b.charCodeAt(i); return a; };

function loadLock(){
  try { const raw = localStorage.getItem(LOCK_LS); lockCfg = raw ? JSON.parse(raw) : null; } catch(e){ lockCfg = null; }
}
function saveLock(){ try { localStorage.setItem(LOCK_LS, JSON.stringify(lockCfg)); } catch(e){} }

async function deriveKey(pass, saltArr){
  const base = await SUBTLE.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return SUBTLE.deriveKey({name:"PBKDF2", salt:saltArr, iterations:200000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
}
async function encJSON(obj){
  if(!cryptoKey) return JSON.stringify(obj);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await SUBTLE.encrypt({name:"AES-GCM", iv}, cryptoKey,
    new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({enc:1, iv:b64(iv), ct:b64(ct)});
}
async function decJSON(text){
  const o = JSON.parse(text);
  if(!o || !o.enc) return o;                      /* 평문(옛 데이터) */
  if(!cryptoKey) throw new Error("잠겨 있습니다");
  const pt = await SUBTLE.decrypt({name:"AES-GCM", iv:ub64(o.iv)}, cryptoKey, ub64(o.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function verifyKey(key){
  try {
    const prev = cryptoKey; cryptoKey = key;
    const v = await decJSON(lockCfg.check);
    cryptoKey = prev;
    return v && v.ok === "haru";
  } catch(e){ return false; }
}

/* ── 잠금 화면 ── */
let gateBusy = false;
function showApp(){

}

  $("wrap").hidden = true;

function gateMsg(t){ const el = $("g-msg"); if(el) el.textContent = t || ""; }

function gateSetup(){
  gate('<h2>비밀번호를 정해 주세요</h2>'
    + '<p>이 비밀번호로 기록을 암호로 잠급니다. 비밀번호를 모르면 이 기기에서도, '
    + '동기화 저장소에서도 내용을 읽을 수 없습니다.</p>'
    + '<input type="password" class="f" id="g-p1" placeholder="비밀번호 (8자 이상)" autocomplete="new-password">'
    + '<input type="password" class="f" id="g-p2" placeholder="한 번 더" autocomplete="new-password">'
    + '<div class="gatenote">잠금을 켜면 <b>복구 키 파일</b>이 한 번 내려받아집니다. '
    + '비밀번호를 잊었을 때 그 파일로만 되살릴 수 있으니, 이 기기 밖 안전한 곳에 보관해 두세요.</div>'
    + '<label class="gatechk"><input type="checkbox" id="g-ack">복구 키 파일을 보관하겠습니다</label>'
    + '<div class="gatemsg" id="g-msg"></div>'
    + '<button class="btn primary" id="g-go">잠금 켜고 시작하기</button>'
    + '<button class="gatelink" id="g-skip">잠금 없이 쓰기</button>');
  const go = async () => {
    if(gateBusy) return;
    const p1 = $("g-p1").value, p2 = $("g-p2").value;

    gateBusy = true; gateMsg("잠그는 중…");
    try {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const key = await deriveKey(p1, salt);
      cryptoKey = key;
      lockCfg = {salt:b64(salt), check: await encJSON({ok:"haru"})};
      saveLock();
      await bootData();          /* 기존 평문 데이터를 읽어 들이고 */
      await saveLocal();         /* 암호문으로 다시 저장 */
      await downloadRecovery(key);
      showApp();
    } catch(e){ gateMsg("실패했습니다: " + (e.message || e)); }
    gateBusy = false;
  };
  $("g-go").onclick = go;
  $("g-p2").onkeydown = e => { if(!composing(e) && e.key === "Enter") go(); };
  $("g-skip").onclick = async () => {
    if(!confirm("잠금 없이 쓰면 이 주소를 아는 사람이 기록을 볼 수 있습니다.\n계속할까요?")) return;
    lockCfg = {off:true}; saveLock();
    await bootData(); showApp();
  };
  setTimeout(() => { const el = $("g-p1"); if(el) el.focus(); }, 30);
}

function gateUnlock(){
  gate('<h2>비밀번호를 넣어 주세요</h2>'
    + '<input type="password" class="f" id="g-p1" placeholder="비밀번호" autocomplete="current-password">'
    + '<label class="gatechk"><input type="checkbox" id="g-keep">이 기기에서는 다음부터 묻지 않기</label>'
    + '<div class="gatemsg" id="g-msg"></div>'
    + '<button class="btn primary" id="g-go">열기</button>'

  const go = async () => {
    if(gateBusy) return;
    gateBusy = true; gateMsg("확인 중…");
    try {
      const key = await deriveKey($("g-p1").value, ub64(lockCfg.salt));
      if(!(await verifyKey(key))){ gateMsg("비밀번호가 맞지 않습니다."); gateBusy = false; return; }
      cryptoKey = key;
      if($("g-keep").checked){
        lockCfg.remember = b64(await SUBTLE.exportKey("raw", key)); saveLock();
      }
      await bootData(); showApp();
    } catch(e){ gateMsg("열지 못했습니다: " + (e.message || e)); }

  };
  $("g-go").onclick = go;
