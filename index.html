    try {
      const txt = await f.text();
      const m = txt.match(/KEY:\s*([A-Za-z0-9+/=]+)/);
      if(!m) throw new Error("복구 키를 찾을 수 없는 파일입니다");
      const key = await SUBTLE.importKey("raw", ub64(m[1]), {name:"AES-GCM"}, true, ["encrypt","decrypt"]);
      if(!(await verifyKey(key))) throw new Error("이 기록의 복구 키가 아닙니다");
      cryptoKey = key;
      await bootData(); showApp();
      toast("복구 키로 열었습니다. 비밀번호를 새로 정하시려면 우측 위 톱니바퀴를 누르세요");
    } catch(e){ gateMsg(e.message || String(e)); }
  };
  setTimeout(() => { const el = $("g-p1"); if(el) el.focus(); }, 30);
}

async function downloadRecovery(key){
  const raw = b64(await SUBTLE.exportKey("raw", key));
  const body = "하루 기록장 복구 키\n"
    + "만든 날짜: " + TODAY + "\n\n"
    + "비밀번호를 잊었을 때 잠금 화면의 '복구 키 파일로 열기'에 이 파일을 넣으면 열립니다.\n"
    + "이 파일만 있으면 기록을 읽을 수 있으니 아무 데나 두지 마세요.\n\n"
    + "KEY: " + raw + "\n";
  const url = URL.createObjectURL(new Blob([body], {type:"text/plain;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url; a.download = "하루기록장-복구키.txt";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function lockNow(){
  cryptoKey = null;
  if(lockCfg && lockCfg.remember){ delete lockCfg.remember; saveLock(); }
  location.reload();
}

/* ═══════════ 기기 간 동기화 (GitHub Gist) ═══════════ */
const SYNC_LS = "haru-sync-v1";
const GH = "https://api.github.com";
const GIST_FILE = "haru-record.json";
let sync = {gistId:"", token:"", on:false};
let syncState = "off", syncMsg = "", syncAt = 0, pushTimer = null;

function loadSync(){
  try {
    const raw = localStorage.getItem(SYNC_LS);
    if(raw){ const o = JSON.parse(raw); sync.gistId = o.gistId || ""; sync.token = o.token || ""; }
  } catch(e){}
  sync.on = !!(sync.gistId && sync.token);
  syncState = sync.on ? "idle" : "off";
}
function saveSync(){
  try { localStorage.setItem(SYNC_LS, JSON.stringify({gistId:sync.gistId, token:sync.token})); } catch(e){}
  sync.on = !!(sync.gistId && sync.token);
  syncState = sync.on ? "idle" : "off";
}
function setSync(st, msg){ syncState = st; syncMsg = msg || ""; if(st === "idle") syncAt = Date.now(); renderSave(); }

async function ghFetch(path, method, body, token){
  const h = {"Authorization":"Bearer " + (token || sync.token),
             "Accept":"application/vnd.github+json",
             "X-GitHub-Api-Version":"2022-11-28"};
  if(body) h["Content-Type"] = "application/json";
  const r = await fetch(GH + path, {method: method || "GET", headers: h,
                                    body: body ? JSON.stringify(body) : undefined});
  if(!r.ok){
    const t = await r.text().catch(() => "");
    throw new Error(r.status + (r.status === 401 ? " 토큰이 올바르지 않습니다"
      : r.status === 404 ? " 저장소를 찾을 수 없습니다" : " " + t.slice(0,80)));
  }
  return r.json();
}
async function gistRead(id, token){
  const g = await ghFetch("/gists/" + id, "GET", null, token);
  const f = (g.files || {})[GIST_FILE];
  if(!f) return null;
  let c = f.content;
  if(f.truncated && f.raw_url) c = await (await fetch(f.raw_url)).text();
  return decJSON(c);
}
async function adoptRemote(remote){
  const view = S.view;
  S = migrate(Object.assign(blank(), remote));
  S.view = view;
  await saveLocal();
  dirty = false;
}
async function syncPull(silent){
  if(!sync.on) return;
  setSync("pulling");
  try {
    const remote = await gistRead(sync.gistId);
    if(!remote){ await syncPush(true); return; }
    const rAt = remote.updatedAt || 0, lAt = S.updatedAt || 0;
    if(rAt > lAt){
      await adoptRemote(remote); render();
      if(!silent) toast("다른 기기의 최신 기록을 받아왔습니다");
      setSync("idle");
    } else if(lAt > rAt){ await syncPush(true); }
    else setSync("idle");
  } catch(e){ setSync("error", e.message || String(e)); }
}
async function syncPush(force){
  if(!sync.on) return;
  setSync("pushing");
  try {
    if(!force){
      const remote = await gistRead(sync.gistId);
      if(remote && (remote.updatedAt || 0) > (S.updatedAt || 0)){
        setSync("conflict", "다른 기기 기록이 더 최신입니다");
        return;
      }
    }
    const files = {}; files[GIST_FILE] = {content: await encJSON(S)};
    await ghFetch("/gists/" + sync.gistId, "PATCH", {files});
    dirty = false;
    setSync("idle");
  } catch(e){ setSync("error", e.message || String(e)); }
}
function schedulePush(){
  if(!sync.on) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => syncPush(false), 2500);
}

function openSyncModal(){
  if($("scrim")) return;
  const scrim = document.createElement("div");
  scrim.className = "scrim"; scrim.id = "scrim";
  const close = () => { scrim.remove(); document.removeEventListener("keydown", onKey, true); };
  const onKey = e => { if(e.key === "Escape"){ e.stopPropagation(); close(); } };
  let busy = "";
  const draw = () => {
    const bytes = stateBytes();
    scrim.innerHTML = '<div class="modal wide" role="dialog" aria-modal="true">'
      + '<div class="mdhead"><h4>설정</h4><span class="sp"></span>'
      + '<span class="hbhint">' + (sync.on ? "켜져 있습니다" : "꺼져 있습니다") + '</span></div>'
      + '<div class="mdbody">'
      + '<div class="fld"><label>GitHub 토큰</label>'
      + '<input type="password" class="f" id="sy-token" placeholder="ghp_ 또는 github_pat_ 로 시작"'
      + ' value="' + esc(sync.token) + '" autocomplete="off"></div>'
      + '<div class="fld"><label>저장소 (Gist ID)</label><div class="frow">'
      + '<input type="text" class="f" id="sy-gist" placeholder="아직 없으면 오른쪽 버튼으로 만드세요"'
      + ' value="' + esc(sync.gistId) + '" style="flex:1">'
      + '<button class="btn" id="sy-new">새로 만들기</button></div></div>'
      + '<div class="pdsum">'
      + '<span class="stat">상태 <b>' + esc(busy || syncLabel()) + '</b></span>'
      + '<span class="stat">이 기기 기록 <b>' + mb(bytes) + '</b></span>'
      + (syncMsg ? '<span class="stat" style="color:var(--sun)">' + esc(syncMsg) + '</span>' : '')
      + '</div>'
      + '<p class="hbhint" style="line-height:1.7;margin:0">'
      + '토큰은 <b>이 기기 브라우저에만</b> 저장되고 페이지에는 들어가지 않습니다. '
      + 'GitHub → Settings → Developer settings → Personal access tokens 에서 '
      + '<b>gist 권한만</b> 준 토큰을 만들어 쓰세요. 기기마다 한 번씩 넣으면 그 뒤로는 자동입니다. '
      + '올라가는 내용은 <b>비밀번호로 암호화</b>되어 있습니다.</p>'
      + '<div class="fld" style="border-top:1px solid var(--line-2); padding-top:13px">'
      + '<label>잠금</label>'
      + (cryptoKey
          ? '<div class="frow"><button class="btn" id="sy-pw">비밀번호 바꾸기</button>'
            + '<button class="btn" id="sy-rec">복구 키 다시 받기</button>'
            + '<button class="btn" id="sy-lock">지금 잠그기</button></div>'
          : '<span class="hbhint">잠금이 꺼져 있습니다. 켜려면 이 기기의 기록을 지우고 다시 여셔야 합니다.</span>')
      + '</div>'
      + '</div><div class="mdfoot">'
      + (sync.on ? '<button class="btn" id="sy-off">연결 해제</button>' : '')
      + '<span class="sp"></span>'
      + (sync.on ? '<button class="btn" id="sy-now">지금 동기화</button>' : '')
      + '<button class="btn" id="sy-cancel">닫기</button>'
      + '<button class="btn primary" id="sy-save">연결</button></div></div>';
    wire();
  };
  const wire = () => {
    scrim.querySelector("#sy-cancel").onclick = close;
    scrim.querySelector("#sy-new").onclick = async () => {
      const tk = scrim.querySelector("#sy-token").value.trim();
      if(!tk){ toast("토큰을 먼저 넣어 주세요"); return; }
      busy = "저장소 만드는 중…"; draw();
      try {
        const files = {}; files[GIST_FILE] = {content: await encJSON(S)};
        const g = await ghFetch("/gists", "POST", {description:"하루 기록장 데이터", public:false, files}, tk);
        sync.token = tk; sync.gistId = g.id; saveSync();
        busy = ""; setSync("idle"); draw();
        toast("저장소를 만들었습니다");
      } catch(e){ busy = ""; syncMsg = e.message || String(e); draw(); }
    };
    scrim.querySelector("#sy-save").onclick = async () => {
      sync.token = scrim.querySelector("#sy-token").value.trim();
      sync.gistId = scrim.querySelector("#sy-gist").value.trim();
      if(!sync.token || !sync.gistId){ toast("토큰과 저장소를 모두 넣어 주세요"); return; }
      saveSync();
      busy = "확인 중…"; syncMsg = ""; draw();
      try {
        const remote = await gistRead(sync.gistId);
        busy = "";
        if(remote && (remote.updatedAt || 0) > (S.updatedAt || 0)){
          await adoptRemote(remote); render();
          toast("저장소의 기록을 받아왔습니다");
        } else { await syncPush(true); toast("이 기기 기록을 올렸습니다"); }
        close(); renderSave();
      } catch(e){ busy = ""; syncMsg = e.message || String(e); draw(); }
    };
    const off = scrim.querySelector("#sy-off");
    if(off) off.onclick = () => {
      if(!confirm("이 기기에서 동기화를 끊습니다.\n저장소의 기록은 그대로 남습니다.")) return;
      sync.gistId = ""; sync.token = ""; saveSync(); syncMsg = "";
      close(); renderSave(); toast("동기화를 껐습니다");
    };
    const now = scrim.querySelector("#sy-now");
    if(now) now.onclick = async () => { busy = "동기화 중…"; draw(); await syncPull(false); busy = ""; draw(); };
    const lk = scrim.querySelector("#sy-lock");
    if(lk) lk.onclick = () => { close(); lockNow(); };
    const rc = scrim.querySelector("#sy-rec");
    if(rc) rc.onclick = async () => { await downloadRecovery(cryptoKey); toast("복구 키 파일을 내려받았습니다"); };
    const pw = scrim.querySelector("#sy-pw");
    if(pw) pw.onclick = async () => {
      const p1 = prompt("새 비밀번호를 넣어 주세요 (8자 이상)");
      if(p1 == null) return;
      if(p1.length < 8){ toast("8자 이상으로 해주세요"); return; }
      const p2 = prompt("한 번 더 넣어 주세요");
      if(p2 !== p1){ toast("두 번 입력한 값이 다릅니다"); return; }
      busy = "바꾸는 중…"; draw();
      try {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const key = await deriveKey(p1, salt);
        cryptoKey = key;
        lockCfg = {salt:b64(salt), check: await encJSON({ok:"haru"})};
        saveLock();
        await saveLocal();
        if(sync.on) await syncPush(true);
        await downloadRecovery(key);
        busy = ""; draw();
        toast("비밀번호를 바꿨습니다. 새 복구 키를 보관해 주세요");
      } catch(e){ busy = ""; syncMsg = e.message || String(e); draw(); }
    };
  };
  const openedAt = Date.now();
  scrim.onclick = e => { if(e.target === scrim && Date.now() - openedAt > 350) close(); };
  document.addEventListener("keydown", onKey, true);
  document.body.appendChild(scrim);
  draw();
}
function syncLabel(){
  return {off:"꺼짐", idle:"동기화됨", pulling:"받는 중…", pushing:"올리는 중…",
          error:"연결 실패", conflict:"충돌"}[syncState] || "";
}

/* ═══════════ 보관 / 내보내기 ═══════════ */
$("keep").onclick = async () => {
  if(!artifactApi || keeping) return;
  keeping = true; renderSave();
  const json = (await encJSON(S)).replace(/</g, "\\u003c");
  const doc = PRISTINE.replace(/(<script[^>]*id="app-state"[^>]*>)([\s\S]*?)(<\/script>)/,
    (m,a,b,c) => a + json + c);
  try {
    await artifactApi.publish(doc);
    dirty = false; keeping = false; renderSave(); toast("기록을 보관했습니다");
  } catch(err){
    keeping = false;
    const code = err && err.code;
    if(code === "conflict"){ renderSave(); toast("다른 곳에서 먼저 보관했습니다. 새 내용을 불러옵니다"); }
    else if(code === "not_granted" || code === "not_writer"){
      artifactApi = null; renderSave(); toast("보관 권한이 없어 이 브라우저에만 저장됩니다");
    } else { renderSave(); toast("보관하지 못했습니다. 잠시 후 다시 시도해 주세요"); }
  }
};
$("export").onclick = async () => {
  if(!downloadsApi) return;
  try { await downloadsApi.save({filename:"하루기록장-" + TODAY + ".json", data: JSON.stringify(S, null, 2)}); }
  catch(err){}
};

/* ═══════════ 시작 ═══════════ */
async function bootData(){
  await loadState();
  loadSync();
  render();
  $("syncbtn").onclick = openSyncModal;
  if(sync.on){
    syncPull(true);
    document.addEventListener("visibilitychange", () => {
      if(!document.hidden && sync.on && syncState !== "pushing") syncPull(true);
    });
    setInterval(() => { if(!document.hidden && sync.on && syncState === "idle") syncPull(true); }, 180000);
  }
  if(dirty) toast("이 브라우저에만 있던 최신 기록을 불러왔습니다");
  try { artifactApi = await claude.use("artifact"); } catch(e){ artifactApi = null; }
  renderSave();
  try { downloadsApi = await claude.use("downloads"); } catch(e){ downloadsApi = null; }
  if(downloadsApi) $("export").hidden = false;
}

(async () => {
  loadLock();
  if(!SUBTLE){ gateUnsupported(); return; }
  if(!lockCfg){ gateSetup(); return; }
  if(lockCfg.off){ await bootData(); showApp(); return; }
  if(lockCfg.remember){
    try {
      const key = await SUBTLE.importKey("raw", ub64(lockCfg.remember), {name:"AES-GCM"}, true, ["encrypt","decrypt"]);
      if(await verifyKey(key)){ cryptoKey = key; await bootData(); showApp(); return; }
    } catch(e){}
  }
  gateUnlock();
})();
</script>
