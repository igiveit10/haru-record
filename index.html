<style>
:root{
  --paper:#F3F5F0; --card:#FFFFFF; --card-2:#FAFBF8;
  --ink:#19211E; --ink-2:#4E5B56; --ink-3:#7C8985;
  --line:#DFE3DB; --line-2:#ECEFE8; --rule:#E4E8DF;
  --accent:#2E7A6C; --accent-ink:#1F5C51; --accent-soft:#DDEBE6; --on-accent:#FFFFFF;
  --tag-p-bg:#F0E7D7; --tag-p-ink:#7C5820; --tag-p-line:#D8C29A;
  --sun:#B24A3E; --sat:#3A6491; --warn:#9A6420;
  --shadow:0 1px 2px rgba(25,33,30,.05), 0 8px 24px -12px rgba(25,33,30,.18);
  --pop:0 10px 34px -8px rgba(25,33,30,.28), 0 2px 6px rgba(25,33,30,.08);
  --serif:"Gowun Batang","Nanum Myeongjo",serif;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101513; --card:#171E1B; --card-2:#1C2421;
    --ink:#E7EDE9; --ink-2:#A6B3AE; --ink-3:#78857F;
    --line:#2A3330; --line-2:#212925; --rule:#252E2B;
    --accent:#6CC0AD; --accent-ink:#8FD4C4; --accent-soft:#1E332E; --on-accent:#0E1614;
    --tag-p-bg:#33291A; --tag-p-ink:#D5A660; --tag-p-line:#4E3E24;
    --sun:#E08476; --sat:#86AEDA; --warn:#D9A25C;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    --pop:0 10px 34px -8px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#101513; --card:#171E1B; --card-2:#1C2421;
  --ink:#E7EDE9; --ink-2:#A6B3AE; --ink-3:#78857F;
  --line:#2A3330; --line-2:#212925; --rule:#252E2B;
  --accent:#6CC0AD; --accent-ink:#8FD4C4; --accent-soft:#1E332E; --on-accent:#0E1614;
  --tag-p-bg:#33291A; --tag-p-ink:#D5A660; --tag-p-line:#4E3E24;
  --sun:#E08476; --sat:#86AEDA; --warn:#D9A25C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  --pop:0 10px 34px -8px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.wrap{max-width:1280px; margin:0 auto; padding:14px 18px 52px}
.empty{font-size:12.5px; color:var(--ink-3); font-family:var(--serif)}

/* ── 잠금 화면 ── */
.gate{position:fixed; inset:0; z-index:100; background:var(--paper); display:grid;
  place-items:center; padding:24px; overflow:auto}
.gate[hidden]{display:none}
.gatecard{width:min(420px,100%); background:var(--card); border:1px solid var(--line);
  border-radius:16px; box-shadow:var(--shadow); overflow:hidden}
.gatetop{padding:28px 26px 20px; border-bottom:1px solid var(--line-2); text-align:center}
.gatetop h1{margin:0; font-family:var(--serif); font-size:26px; font-weight:700; letter-spacing:-.02em}
.gatetop p{margin:7px 0 0; font-size:12.5px; color:var(--ink-3)}
.gatebody{padding:22px 26px 24px; display:flex; flex-direction:column; gap:13px}
.gatebody h2{margin:0; font-size:14px; font-weight:500; color:var(--ink-2)}
.gatebody p{margin:0; font-size:12px; color:var(--ink-3); line-height:1.7}
.gatebody .f{width:100%; padding:9px 12px; font-size:15px}
.gatebody .btn{width:100%; padding:9px; font-size:14px; justify-content:center; text-align:center}
.gaterow{display:flex; gap:8px}
.gaterow .btn{flex:1}
.gatemsg{font-size:12px; color:var(--sun); min-height:16px}
.gatelink{background:none; border:0; padding:0; font-size:11.5px; color:var(--ink-3);
  text-decoration:underline; text-underline-offset:2px; align-self:center}
.gatelink:hover{color:var(--accent-ink)}
.gatenote{background:var(--card-2); border:1px solid var(--line-2); border-radius:9px;
  padding:11px 13px; font-size:11.5px; color:var(--ink-3); line-height:1.75}
.gatenote b{color:var(--ink-2)}
.gatechk{display:flex; align-items:flex-start; gap:8px; font-size:12.5px; color:var(--ink-2);
  cursor:pointer; line-height:1.5}
.gatechk input{margin-top:2px; width:15px; height:15px; accent-color:var(--accent); flex:none}

/* ── 상단 ── */
.tabbar{display:flex; align-items:flex-end; gap:16px; border-bottom:1px solid var(--line);
  margin-bottom:10px; flex-wrap:wrap}
.tabbar .spacer{flex:1}
.tabs{display:flex; gap:2px; margin-bottom:-1px}
.tabs button{padding:7px 15px 8px; font-size:14px; color:var(--ink-3); letter-spacing:-.01em;
  border-bottom:2px solid transparent; transition:color .15s,border-color .15s; white-space:nowrap}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:500}
.tabbar .savebox{padding-bottom:6px}
.savebox{display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--ink-3)}
.dotpulse{width:6px; height:6px; border-radius:50%; background:var(--accent); flex:none}
.dotpulse.dirty{background:var(--warn)}
.brand{font-family:var(--serif); font-size:17px; font-weight:700; letter-spacing:-.01em;
  margin:0 2px 6px 2px; flex:none; color:var(--ink-2)}
@media (max-width:700px){.brand{display:none}}
.btn{border:1px solid var(--line); background:var(--card); padding:6px 12px; border-radius:var(--r);
  font-size:13px; color:var(--ink-2); transition:border-color .15s,color .15s,background .15s; white-space:nowrap}
.btn:hover{border-color:var(--accent); color:var(--accent-ink)}
.btn[disabled]{opacity:.45; cursor:default}
.btn[disabled]:hover{border-color:var(--line); color:var(--ink-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-ink); border-color:var(--accent-ink); color:var(--on-accent)}
.btn.primary[disabled]:hover{background:var(--accent); border-color:var(--accent)}
.nav{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:15px;
  color:var(--ink-3); transition:background .15s,color .15s}
.nav:hover{background:var(--line-2); color:var(--ink)}
.nav[hidden]{display:none}
.hnav{display:flex; gap:1px; flex:none}
.todaybtn{flex:none; font-size:11.5px; letter-spacing:.06em; padding:4px 13px; border-radius:99px;
  background:var(--accent-soft); color:var(--accent-ink); transition:background .15s,color .15s}
.todaybtn:hover{background:var(--accent); color:var(--on-accent)}
.todaybtn[hidden]{display:none}

.pagehead{display:flex; align-items:center; gap:11px; padding:2px 4px 11px}
.pagehead .phsp{flex:1; min-width:8px}
.phmain{display:flex; align-items:center; gap:11px; min-width:0}
.bignum{font-family:var(--mono); font-size:33px; font-weight:600; line-height:.85; letter-spacing:-.04em;
  color:var(--ink); font-variant-numeric:tabular-nums; flex:none}
.bignum em{font-style:normal; font-size:13px; font-weight:500; margin-left:2px; color:var(--ink-3)}
.pagehead.s0 .bignum,.pagehead.hol .bignum{color:var(--sun)}
.pagehead.s6 .bignum{color:var(--sat)}
.pagemeta{display:flex; flex-direction:column; gap:1px; min-width:0}
.pagemeta b{font-family:var(--serif); font-size:15.5px; font-weight:700; letter-spacing:-.01em}
.pagemeta span{font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}

/* ── 미니 달력 ── */
.headcal{flex:none; width:150px}
.headcal:empty{display:none}
.mh{display:flex; align-items:center; justify-content:space-between; padding:0 2px 2px}
.mh b{font-family:var(--mono); font-size:10px; font-weight:500; color:var(--ink-3);
  letter-spacing:.03em; font-variant-numeric:tabular-nums}
.mh button{width:16px; height:16px; border-radius:4px; color:var(--ink-3); display:grid;
  place-items:center; font-size:10px}
.mh button:hover{background:var(--line-2); color:var(--ink)}
.mgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:0}
.mgrid .hd{font-size:8px; color:var(--ink-3); text-align:center; padding-bottom:1px; line-height:1.2}
.mgrid .hd.s0{color:var(--sun)} .mgrid .hd.s6{color:var(--sat)}
.mc{height:15px; border-radius:3px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; font-family:var(--mono); font-size:9px; color:var(--ink-2);
  font-variant-numeric:tabular-nums; transition:background .12s}
.mc:hover{background:var(--line-2)}
.mc.out{color:var(--ink-3); opacity:.4}
.mc.s0,.mc.hol{color:var(--sun)} .mc.s6{color:var(--sat)}
.mc.wk{background:var(--accent-soft)}
.mc.today{outline:1px solid var(--accent); outline-offset:-2px}
.mc.sel{background:var(--accent); color:var(--on-accent)}
.mc.sel.s0,.mc.sel.s6,.mc.sel.hol{color:var(--on-accent)}
.mc i{width:2.5px; height:2.5px; border-radius:50%; background:var(--accent); display:block; margin-top:-3px}
.mc.sel i{background:var(--on-accent)}
@media (max-width:620px){.headcal{display:none}}

/* ── 패널 ── */
.panel{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column}
.ph{padding:9px 14px 8px; border-bottom:1px solid var(--line); display:flex; align-items:center;
  gap:9px; background:var(--card-2); flex:none}
.ph h3{margin:0; font-size:11.5px; letter-spacing:.15em; color:var(--ink-2); font-weight:500; white-space:nowrap}
.ph em{font-style:normal; font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.ph .sp{flex:1}
.ph .hint2{font-size:10.5px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.daygrid{display:grid; grid-template-columns:minmax(0,1.02fr) minmax(0,1fr); gap:16px; align-items:start}
@media (max-width:940px){.daygrid{grid-template-columns:1fr}}
.colstack{display:flex; flex-direction:column; gap:16px; min-width:0}

.f{background:var(--card-2); border:1px solid var(--line); border-radius:7px; padding:6px 9px;
  font-size:13.5px; transition:border-color .15s,background .15s}
.f::placeholder{color:var(--ink-3)}
.f:focus{outline:none; border-color:var(--accent); background:var(--card)}
.tfield{position:relative; display:inline-block; flex:none}
.tinput{width:100%; font-family:var(--mono); font-size:13px; text-align:center;
  font-variant-numeric:tabular-nums; letter-spacing:.02em}
.tmenu{position:fixed; z-index:120; background:var(--card); border:1px solid var(--line);
  border-radius:10px; box-shadow:var(--pop); padding:5px; overflow-y:auto;
  -webkit-overflow-scrolling:touch}
.topt{display:flex; align-items:center; justify-content:center; width:100%; padding:6px 10px;
  border-radius:7px; font-family:var(--mono); font-size:13px; color:var(--ink-2);
  font-variant-numeric:tabular-nums; letter-spacing:.02em}
.topt b{font-weight:500}
.topt:hover,.topt.on{background:var(--card-2)}
.topt.cur{background:var(--accent-soft); color:var(--accent-ink)}
.topt.cur .tap{color:var(--accent-ink)}
.plus{width:27px; height:27px; flex:none; border:1px dashed var(--line); border-radius:7px;
  color:var(--ink-3); display:grid; place-items:center; font-size:16px; line-height:1;
  transition:border-color .15s,color .15s}
.plus:hover{border-style:solid; border-color:var(--accent); color:var(--accent)}
.pick{display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; flex:none}
.pick button{padding:0 11px; height:28px; font-size:12px; color:var(--ink-3); white-space:nowrap;
  transition:background .15s,color .15s}
.pick button + button{border-left:1px solid var(--line)}
.pick button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}
.pick button.cat-p[aria-pressed="true"]{background:var(--tag-p-ink); color:var(--card)}
.tag{font-size:10px; letter-spacing:.02em; padding:1px 7px; border-radius:99px; white-space:nowrap;
  background:var(--accent-soft); color:var(--accent-ink); flex:none}
.tag.cat-p{background:var(--tag-p-bg); color:var(--tag-p-ink)}
.tag.kindtag{background:transparent; border:1px solid var(--line); color:var(--ink-3)}

/* ── 타임그리드 ── */
.tgtop{display:flex; align-items:flex-start; gap:9px; padding:7px 12px; border-bottom:1px solid var(--line);
  background:var(--card-2); min-height:36px; flex:none}
.tgtop .lb{flex:none; font-size:10px; letter-spacing:.1em; color:var(--ink-3); padding-top:5px; width:26px}
.tgtop .items{flex:1; display:flex; flex-wrap:wrap; gap:4px; min-width:0}
.adchip{display:inline-flex; align-items:center; gap:6px; border-radius:6px; padding:3px 9px;
  font-size:12.5px; max-width:100%; background:var(--accent-soft); color:var(--accent-ink);
  border:1px solid transparent; cursor:pointer}
.adchip.cat-p{background:var(--tag-p-bg); color:var(--tag-p-ink)}
.adchip.task{border-style:dashed; border-color:currentColor}
.adchip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.adchip small{font-family:var(--mono); font-size:10px; opacity:.7}
.adchip.done span{text-decoration:line-through; opacity:.6}
.adchip.moved span,.adchip.deleted span{opacity:.5}
.tgwrap{display:flex; position:relative; flex:1; min-height:0}
.tghours{flex:none; width:52px; border-right:1px solid var(--line-2); background:var(--card)}
.tghour{display:flex; align-items:flex-start; justify-content:flex-end; gap:4px; padding:2px 7px 0 0;
  border-bottom:1px solid var(--rule)}
.tghour b{font-family:var(--mono); font-size:12px; font-weight:500; color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.tghour .ap{font-size:9px; color:var(--ink-3); padding-top:2px}
.tghour.now b{color:var(--accent-ink); font-weight:600}
.tgcanvas{flex:1; position:relative; min-width:0; cursor:crosshair}
.tgnow{position:absolute; left:0; right:0; height:1px; background:var(--sun); z-index:3; pointer-events:none}
.tgnow::before{content:""; position:absolute; left:-3px; top:-3px; width:7px; height:7px;
  border-radius:50%; background:var(--sun)}
.tgitem{position:absolute; border-radius:6px; padding:3px 7px 3px 9px; overflow:hidden;
  background:var(--accent-soft); color:var(--ink); border:1px solid transparent; cursor:grab;
  font-size:12.5px; line-height:1.35; user-select:none; z-index:2;
  box-shadow:0 1px 2px rgba(25,33,30,.07)}
.tgitem::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent)}
.tgitem.cat-p{background:var(--tag-p-bg); color:var(--ink)}
.tgitem.cat-p::before{background:var(--tag-p-ink)}
.tgitem.task{border-style:dashed; border-color:var(--accent)}
.tgitem.task.cat-p{border-color:var(--tag-p-line)}
.tgitem b{display:block; font-family:var(--mono); font-size:10px; font-weight:500; opacity:.75;
  font-variant-numeric:tabular-nums}
.tgitem span{display:block; overflow:hidden; text-overflow:ellipsis}
.tgitem.short{padding-top:1px; display:flex; align-items:center; gap:6px}
.tgitem.short b{display:inline}
.tgitem.done{opacity:.55}
.tgitem.done span{text-decoration:line-through}
.tgitem.moved,.tgitem.deleted{opacity:.45}
.tgitem.dragging{cursor:grabbing; z-index:9; box-shadow:var(--pop); opacity:.92}
.tgfoot{padding:8px 12px; border-top:1px solid var(--line-2); display:flex; gap:10px; flex:none;
  align-items:center}
.tgfoot button{font-size:12px; color:var(--ink-3)}
.tgfoot button:hover{color:var(--accent-ink)}
.tgfoot .sp{flex:1}

/* ── 습관(오늘) ── */
.hbrow{display:flex; flex-wrap:wrap; gap:7px; padding:11px 13px}
.hbtog{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line);
  background:var(--card-2); border-radius:99px; padding:5px 13px 5px 9px; font-size:13px;
  color:var(--ink-2); transition:all .15s}
.hbtog:hover{border-color:var(--accent)}
.hbtog i{width:15px; height:15px; border:1.4px solid var(--line); border-radius:5px; display:grid;
  place-items:center; flex:none; color:var(--on-accent)}
.hbtog svg{width:10px; height:10px; opacity:0}
.hbtog.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}
.hbtog.on i{background:var(--accent); border-color:var(--accent)}
.hbtog.on svg{opacity:1}
.hbnone{padding:11px 14px}
.hbrows{display:flex; flex-direction:column; gap:6px; padding:11px 13px 12px}
.hbline{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.hbline .hbtog{min-width:106px; justify-content:flex-start}
.mval{width:62px; padding:4px 7px; font-family:var(--mono); font-size:12.5px; text-align:right;
  font-variant-numeric:tabular-nums}
.mval::-webkit-outer-spin-button,.mval::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.mval{-moz-appearance:textfield}
.msep{color:var(--ink-3)}
.munit{font-size:11px; color:var(--ink-3); margin-right:4px}

/* ── 기록사항(게시물) ── */
.ntform{padding:10px 13px 12px; border-bottom:1px solid var(--line); display:flex;
  flex-direction:column; gap:8px; background:var(--card-2)}
.ntopts{display:flex; gap:7px; flex-wrap:wrap; align-items:center}
.kindpick{display:flex; flex-wrap:wrap; gap:3px}
.kindpick button{font-size:11.5px; padding:3px 9px; border-radius:99px; border:1px solid var(--line);
  color:var(--ink-3); transition:all .15s; white-space:nowrap}
.kindpick button:hover{border-color:var(--accent); color:var(--accent-ink)}
.kindpick button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.ntform textarea{width:100%; min-height:156px; max-height:460px; resize:vertical;
  background:var(--card); border:1px solid var(--line); border-radius:8px; padding:11px 13px;
  font-family:var(--serif); font-size:14.5px; line-height:1.85; overflow-y:auto}
.ntform textarea:focus{outline:none; border-color:var(--accent)}
.ntactions{display:flex; align-items:center; gap:8px}
.ntactions .sp{flex:1}
.ntactions .mini2{font-size:11px; color:var(--ink-3)}
.ntlist{display:flex; flex-direction:column}
.ntcard{padding:12px 14px 13px; border-bottom:1px solid var(--rule)}
.ntcard:last-child{border-bottom:0}
.ntcard:hover{background:var(--card-2)}
.nthead{display:flex; align-items:center; gap:6px; margin-bottom:6px}
.nthead .sp{flex:1}
.nttime{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.ntdate{font-family:var(--mono); font-size:11px; color:var(--accent-ink); background:var(--accent-soft);
  border-radius:6px; padding:1px 7px; font-variant-numeric:tabular-nums}
.ntdate:hover{background:var(--accent); color:var(--on-accent)}
.ntrm{width:20px; height:20px; border-radius:5px; color:var(--ink-3); opacity:0; font-size:12px;
  display:grid; place-items:center; flex:none}
.ntcard:hover .ntrm{opacity:1}
.ntrm:hover{color:var(--sun)}
@media (hover:none){.ntrm{opacity:.5}}
.nttext{font-family:var(--serif); font-size:14.5px; line-height:1.85; white-space:pre-wrap;
  word-break:break-word; margin:0}
.nttext mark{background:var(--accent-soft); color:var(--accent-ink); border-radius:3px; padding:0 2px}
.ntempty{padding:24px 14px; text-align:center}
.ntcard.editing{background:var(--card-2); box-shadow:inset 2px 0 0 var(--accent)}
.ntedit{display:flex; flex-direction:column; gap:8px}
.ntedit textarea{width:100%; min-height:150px; max-height:460px; resize:vertical;
  background:var(--card); border:1px solid var(--line); border-radius:8px; padding:11px 13px;
  font-family:var(--serif); font-size:14.5px; line-height:1.85; overflow-y:auto}
.ntedit textarea:focus{outline:none; border-color:var(--accent)}
.ntbtns{display:flex; align-items:center; gap:8px}
.ntbtns .sp{flex:1}
.ntmonth{padding:8px 16px; background:var(--card-2); border-bottom:1px solid var(--line);
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--ink-3)}
.ntbar{display:flex; align-items:center; gap:9px; padding:9px 13px; border-bottom:1px solid var(--line);
  background:var(--card-2); flex-wrap:wrap}
.ntbar .sp{flex:1}
.nsearch{width:170px; flex:none}

/* ── 사진 ── */
.shots{display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:6px; margin-top:9px}
.shot{position:relative; aspect-ratio:4/3; border-radius:7px; overflow:hidden; cursor:zoom-in;
  border:1px solid var(--line); background:var(--card-2)}
.shot img{width:100%; height:100%; object-fit:cover; display:block}
.shot .x{position:absolute; top:3px; right:3px; width:19px; height:19px; border-radius:50%;
  background:rgba(16,22,20,.6); color:#fff; font-size:12px; line-height:1; display:grid;
  place-items:center; opacity:0; transition:opacity .12s; cursor:pointer}
.shot:hover .x,.shot:focus-within .x{opacity:1}
@media (hover:none){.shot .x{opacity:.85}}
.lightbox{position:fixed; inset:0; background:rgba(10,14,13,.88); z-index:60; display:flex;
  flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:26px}
.lightbox img{max-width:100%; max-height:calc(100vh - 130px); border-radius:8px}
.lbbar{display:flex; gap:8px; align-items:center}
.lbbar .btn{background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.24); color:#EFF3EF}
.lbbar .btn:hover{background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.45); color:#fff}
.lbbar .cap{font-family:var(--mono); font-size:11px; color:rgba(255,255,255,.55)}
.dropping{outline:2px dashed var(--accent); outline-offset:-5px; border-radius:9px}

/* ── 우클릭 메뉴 ── */
.cmenu{position:fixed; z-index:70; background:var(--card); border:1px solid var(--line);
  border-radius:9px; box-shadow:var(--pop); padding:5px; min-width:158px}
.cmenu button{display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:7px 11px;
  border-radius:6px; font-size:13px; color:var(--ink-2)}
.cmenu button:hover{background:var(--card-2); color:var(--ink)}
.cmenu button.danger:hover{color:var(--sun)}
.cmenu .sep{height:1px; background:var(--line-2); margin:4px 6px}
.cmenu .head{padding:5px 11px 6px; font-size:11px; color:var(--ink-3); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.cmenu .row{display:flex; gap:6px; padding:5px 8px 7px}
.cmenu .row .f{padding:5px 7px; font-size:12.5px}

/* ── 모달 ── */
.scrim{position:fixed; inset:0; background:rgba(12,16,15,.42); z-index:50; display:grid;
  place-items:center; padding:20px}
.modal{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--pop);
  width:min(430px,100%); max-height:calc(100vh - 48px); overflow:auto}
.modal.wide{width:min(660px,100%)}
.modal .hbform{padding:14px 18px 4px}
.mdhead{padding:14px 18px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:9px}
.mdhead h4{margin:0; font-family:var(--serif); font-size:17px; font-weight:700}
.mdhead .sp{flex:1}
.mdbody{padding:15px 18px; display:flex; flex-direction:column; gap:13px}
.fld{display:flex; flex-direction:column; gap:6px}
.fld > label{font-size:11px; letter-spacing:.1em; color:var(--ink-3)}
.fld .f{width:100%}
.frow{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.frow .f{flex:1; min-width:0}
.chk{display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2); cursor:pointer}
.chk input{width:16px; height:16px; accent-color:var(--accent)}
.mdfoot{padding:12px 18px 15px; display:flex; gap:8px; align-items:center; border-top:1px solid var(--line-2)}
.mdfoot .sp{flex:1}

/* ── 주간 ── */
.segbar{display:flex; align-items:center; gap:8px; padding:8px 13px; background:var(--card-2);
  border-bottom:1px solid var(--line); flex-wrap:wrap}
.segbar .sp{flex:1}
.segbar .lbl{font-size:10.5px; letter-spacing:.1em; color:var(--ink-3)}
.seg2{display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; background:var(--card)}
.seg2 button{padding:4px 12px; font-size:12px; color:var(--ink-3); white-space:nowrap;
  transition:background .15s,color .15s}
.seg2 button + button{border-left:1px solid var(--line)}
.seg2 button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:500}
.seg2 button.cat-p[aria-pressed="true"]{background:var(--tag-p-bg); color:var(--tag-p-ink)}

.wtghead{display:grid; grid-template-columns:46px repeat(7,minmax(0,1fr));
  border-bottom:1px solid var(--line); background:var(--card-2)}
.wtghead > span{border-right:1px solid var(--line-2)}
.wtgd{padding:5px 3px 6px; display:flex; flex-direction:column; align-items:center; gap:0;
  border-right:1px solid var(--line-2); transition:background .12s; min-width:0}
.wtgd:last-child{border-right:0}
.wtgd:hover{background:var(--line-2)}
.wtgd i{font-style:normal; font-size:9.5px; color:var(--ink-3)}
.wtgd b{font-family:var(--mono); font-size:13px; font-weight:500; color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.wtgd.s0 i,.wtgd.s0 b,.wtgd.hol i,.wtgd.hol b{color:var(--sun)}
.wtgd.s6 i,.wtgd.s6 b{color:var(--sat)}
.wtgd.today b{background:var(--accent); color:var(--on-accent); border-radius:99px; padding:0 6px}
.wtgd.sel{background:var(--accent-soft)}
.wtgall{display:grid; grid-template-columns:46px repeat(7,minmax(0,1fr));
  border-bottom:1px solid var(--line); background:var(--card-2); min-height:26px}
.wtgall > .lb{font-size:9.5px; letter-spacing:.08em; color:var(--ink-3); padding:5px 6px 0 0;
  text-align:right; border-right:1px solid var(--line-2)}
.wtgacell{border-right:1px solid var(--line-2); padding:3px 3px; display:flex; flex-direction:column;
  gap:2px; min-width:0}
.wtgacell:last-child{border-right:0}
.wtgacell .adchip{font-size:10.5px; padding:1px 6px; border-radius:4px}
.wtgwrap{display:flex; min-width:0}
.wtghours{flex:none; width:46px; border-right:1px solid var(--line-2); background:var(--card)}
.wtghour{display:flex; align-items:flex-start; justify-content:flex-end; gap:3px; padding:1px 6px 0 0;
  border-bottom:1px solid var(--rule)}
.wtghour b{font-family:var(--mono); font-size:11px; font-weight:500; color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.wtghour .ap{font-size:8px; color:var(--ink-3); padding-top:2px}
.wtgcols{flex:1; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); min-width:0}
.wtgcol{position:relative; border-right:1px solid var(--line-2); min-width:0; cursor:crosshair}
.wtgcol:last-child{border-right:0}
.wtgcol.today{background:var(--card-2)}
.wtgitem{position:absolute; border-radius:5px; padding:1px 4px 1px 6px; overflow:hidden;
  background:var(--accent-soft); color:var(--ink); border:1px solid transparent; cursor:grab;
  font-size:11px; line-height:1.25; user-select:none; z-index:2}
.wtgitem::before{content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--accent)}
.wtgitem.cat-p{background:var(--tag-p-bg)}
.wtgitem.cat-p::before{background:var(--tag-p-ink)}
.wtgitem.task{border-style:dashed; border-color:var(--accent)}
.wtgitem.task.cat-p{border-color:var(--tag-p-line)}
.wtgitem b{display:block; font-family:var(--mono); font-size:9px; font-weight:500; opacity:.7}
.wtgitem span{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.wtgitem.done{opacity:.5} .wtgitem.done span{text-decoration:line-through}
.wtgitem.moved,.wtgitem.deleted{opacity:.4}
.wtgitem.dragging{cursor:grabbing; z-index:9; box-shadow:var(--pop); opacity:.92}
.wtgnow{position:absolute; left:0; right:0; height:1px; background:var(--sun); z-index:3; pointer-events:none}

.wlist{display:flex; flex-direction:column}
.wlday{display:flex; align-items:baseline; gap:9px; padding:7px 13px; background:var(--card-2);
  border-bottom:1px solid var(--line); border-top:1px solid var(--line-2)}
.wlday:first-child{border-top:0}
.wlday b{font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums}
.wlday i{font-style:normal; font-size:11px; color:var(--ink-3)}
.wlday.s0 b,.wlday.hol b{color:var(--sun)} .wlday.s6 b{color:var(--sat)}
.wlday .sp{flex:1}
.wlday em{font-style:normal; font-family:var(--mono); font-size:10.5px; color:var(--ink-3)}
.wlrow{display:flex; align-items:baseline; gap:9px; padding:6px 13px; border-bottom:1px solid var(--rule);
  font-size:13.5px; cursor:default}
.wlrow:hover{background:var(--card-2)}
.wltime{font-family:var(--mono); font-size:11px; color:var(--ink-3); flex:none; width:82px;
  font-variant-numeric:tabular-nums}
.wlrow .txt{flex:1; min-width:0; word-break:break-word}
.wlrow.done .txt{color:var(--ink-3); text-decoration:line-through}
.wlrow.moved .txt,.wlrow.deleted .txt{color:var(--ink-3); opacity:.7}
.wlnone{padding:8px 13px; border-bottom:1px solid var(--rule)}

/* ── 프로젝트 자동완성 ── */
.acwrap{position:relative; display:block}
.acbox{position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:90; background:var(--card);
  border:1px solid var(--line); border-radius:9px; box-shadow:var(--pop); padding:4px;
  max-height:230px; overflow:auto}
.acitem{display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:6px 9px;
  border-radius:6px; font-size:13px; color:var(--ink-2)}
.acitem:hover,.acitem.on{background:var(--accent-soft); color:var(--accent-ink)}
.acitem .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.acitem .ct{font-family:var(--mono); font-size:10px; color:var(--ink-3)}
.achint{padding:6px 10px 5px; font-size:10.5px; color:var(--ink-3); border-top:1px solid var(--line-2);
  margin-top:3px; line-height:1.5}
.acbox.empty .achint{border-top:0; margin-top:0}

/* ── 프로젝트 탭 ── */
.prjlist{list-style:none; margin:0; padding:0}
.prjlist li{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--rule);
  cursor:pointer; transition:background .12s}
.prjlist li:last-child{border-bottom:0}
.prjlist li:hover{background:var(--card-2)}
.prjlist li.on{background:var(--accent-soft)}
.prjlist li.on .pnm{color:var(--accent-ink); font-weight:500}
.pnm{flex:1; min-width:0; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pmeta{font-family:var(--mono); font-size:11px; color:var(--ink-3); flex:none;
  font-variant-numeric:tabular-nums; text-align:right}
.prjadd{display:flex; gap:7px; padding:10px 13px; border-top:1px solid var(--line); align-items:center}
.prjadd input{flex:1; min-width:0}
.pdhead{display:flex; align-items:center; gap:9px; padding:12px 15px 11px; border-bottom:1px solid var(--line)}
.pdhead h4{margin:0; font-family:var(--serif); font-size:18px; font-weight:700; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pdhead .sp{flex:1}
.pdstat{display:flex; gap:9px; flex-wrap:wrap; padding:10px 15px; background:var(--card-2);
  border-bottom:1px solid var(--line); font-size:11.5px; color:var(--ink-3)}
.pdstat .stat{display:inline-flex; align-items:baseline; gap:6px}
.pdstat b{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--ink);
  font-variant-numeric:tabular-nums}
.pdsec{padding:7px 15px 6px; font-size:10.5px; letter-spacing:.13em; color:var(--ink-3);
  background:var(--card-2); border-bottom:1px solid var(--line-2); border-top:1px solid var(--line-2)}
.pdrow{display:flex; align-items:baseline; gap:9px; padding:7px 15px; border-bottom:1px solid var(--rule);
  font-size:13.5px; cursor:pointer}
.pdrow:hover{background:var(--card-2)}
.pdrow .wkwhen{width:58px}
.pdrow .txt{flex:1; min-width:0; word-break:break-word}
.pdrow.done .txt{color:var(--ink-3); text-decoration:line-through}
.pdrow.moved .txt{color:var(--ink-3); opacity:.7}
.pdnone{padding:20px 15px; text-align:center}

/* ── 주간 돌아보기 ── */
.rvw{padding:13px 15px 15px; display:flex; flex-direction:column; gap:13px}
.rvwline{font-family:var(--serif); font-size:14.5px; line-height:1.85; margin:0; color:var(--ink-2)}
.rvwline b{color:var(--ink); font-weight:700}
.bars{display:flex; flex-direction:column; gap:6px}
.bar{display:flex; align-items:center; gap:9px}
.bar .nm{flex:none; width:96px; font-size:12px; color:var(--ink-2); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.bar .track{flex:1; display:block; height:9px; background:var(--line-2); border-radius:99px;
  overflow:hidden; min-width:0}
.bar .fill{display:block; height:100%; min-width:3px; background:var(--accent); border-radius:99px}
.bar .fill.cat-p{background:var(--tag-p-ink)}
.bar .val{flex:none; font-family:var(--mono); font-size:11px; color:var(--ink-3); width:56px;
  text-align:right; font-variant-numeric:tabular-nums}
.rvwsub{font-size:10.5px; letter-spacing:.12em; color:var(--ink-3); margin:2px 0 -4px}
.rvwbtns{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.rvwbtns .sp{flex:1}
.promptbox{width:100%; min-height:150px; max-height:280px; resize:vertical; background:var(--card-2);
  border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-family:var(--mono);
  font-size:11.5px; line-height:1.7; white-space:pre; overflow:auto}
.promptbox:focus{outline:none; border-color:var(--accent)}
.wkmeta{display:flex; align-items:center; gap:9px; padding:9px 14px; background:var(--card-2);
  border-bottom:1px solid var(--line); font-size:11.5px; color:var(--ink-3); flex-wrap:wrap}
.wkmeta .sp{flex:1}
.wkmeta b{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--ink);
  font-variant-numeric:tabular-nums}
.wkmeta .stat{display:inline-flex; align-items:baseline; gap:6px}
.wkrow{display:grid; grid-template-columns:80px repeat(7,minmax(0,1fr)); border-bottom:1px solid var(--rule)}
.wkrow:last-child{border-bottom:0}
.wklb.sub{padding-left:18px; opacity:.85}
.wklb{padding:8px 10px; font-size:11px; color:var(--ink-3); display:flex; align-items:center;
  border-right:1px solid var(--line-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.wkcell{padding:8px 6px; font-family:var(--mono); font-size:12.5px; color:var(--ink-2);
  font-variant-numeric:tabular-nums; border-right:1px solid var(--line-2); display:flex;
  align-items:center; justify-content:center; min-width:0}
.wkcell:last-child{border-right:0}
.wkcell.zero{color:var(--ink-3); opacity:.45}
.wkcell.full{color:var(--accent-ink)}
.wkhead{background:var(--card-2); border-bottom:1px solid var(--line)}
.wkday{padding:7px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:1px;
  border-right:1px solid var(--line-2); transition:background .12s}
.wkday:last-child{border-right:0}
.wkday:hover{background:var(--line-2)}
.wkday i{font-style:normal; font-size:10px; color:var(--ink-3)}
.wkday b{font-family:var(--mono); font-size:14px; font-weight:500; color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.wkday.s0 i,.wkday.s0 b,.wkday.hol i,.wkday.hol b{color:var(--sun)}
.wkday.s6 i,.wkday.s6 b{color:var(--sat)}
.wkday.today b{background:var(--accent); color:var(--on-accent); border-radius:99px; padding:0 7px}
.wkday.sel{background:var(--accent-soft)}
.wksep{padding:7px 12px; font-size:10.5px; letter-spacing:.14em; color:var(--ink-3);
  background:var(--card-2); border-bottom:1px solid var(--line); border-top:1px solid var(--line)}
.wkchk{border-right:1px solid var(--line-2); display:grid; place-items:center; padding:5px 0;
  transition:background .12s}
.wkchk:last-child{border-right:0}
.wkchk:hover{background:var(--line-2)}
.wkchk span{width:17px; height:17px; border:1.4px solid var(--line); border-radius:5px; display:grid;
  place-items:center; color:var(--on-accent)}
.wkchk svg{width:11px; height:11px; opacity:0}
.wkchk.on span{background:var(--accent); border-color:var(--accent)}
.wkchk.on svg{opacity:1}
.wkchk.future{opacity:.4}
.wkdot{width:7px; height:7px; border-radius:50%; background:var(--accent); display:block}
.wkdot.off{background:var(--line); width:5px; height:5px}
.wklist{list-style:none; margin:0; padding:0}
.wklist li{display:flex; align-items:baseline; gap:9px; padding:6px 13px; border-bottom:1px solid var(--rule);
  font-size:13.5px; cursor:pointer}
.wklist li:last-child{border-bottom:0}
.wklist li:hover{background:var(--card-2)}
.wkwhen{font-family:var(--mono); font-size:11px; color:var(--ink-3); flex:none; width:52px;
  font-variant-numeric:tabular-nums}
.wklist .txt{flex:1; min-width:0; word-break:break-word}
.wklist li.done .txt{color:var(--ink-3); text-decoration:line-through}
.wklist li.moved .txt,.wklist li.deleted .txt{color:var(--ink-3); opacity:.7}
.wkgrid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:start}
@media (max-width:860px){.wkgrid2{grid-template-columns:1fr}}

/* ── 프로젝트 색 ── */
.pc0{--pc:#3E8C7A; --pcs:#D9EBE5; --pck:#1E5A4D}
.pc1{--pc:#B08340; --pcs:#F3E7D4; --pck:#7A5620}
.pc2{--pc:#5A7FA8; --pcs:#DEE7F1; --pck:#2F5075}
.pc3{--pc:#9A6A96; --pcs:#EDE0EC; --pck:#6A3F66}
.pc4{--pc:#7F9155; --pcs:#E6EBD8; --pck:#51602F}
.pc5{--pc:#B96A52; --pcs:#F4E1DA; --pck:#8A4632}
.pc6{--pc:#4E93A0; --pcs:#DAEAEE; --pck:#2A626E}
.pc7{--pc:#7C77B5; --pcs:#E4E2F2; --pck:#4E4A85}
.pcx{--pc:#9AA6A1; --pcs:#E9EDE7; --pck:#5A665F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
.pc0{--pc:#6FBFAA; --pcs:#1E332E; --pck:#8FD4C4}
.pc1{--pc:#D2A464; --pcs:#33291A; --pck:#E0BC8A}
.pc2{--pc:#86AEDA; --pcs:#1D2836; --pck:#A6C6E8}
.pc3{--pc:#C596C0; --pcs:#2E2130; --pck:#D7B2D3}
.pc4{--pc:#A8BC7C; --pcs:#262C1C; --pck:#C0D19A}
.pc5{--pc:#DB9179; --pcs:#33221C; --pck:#E8AE9A}
.pc6{--pc:#74BACA; --pcs:#172C31; --pck:#9AD0DC}
.pc7{--pc:#A6A1DC; --pcs:#23212F; --pck:#BFBBE8}
.pcx{--pc:#6E7A75; --pcs:#232B28; --pck:#9CAAA4}

<script>
const PRISTINE = "<!doctype html>\n" + document.documentElement.outerHTML;

/* ═══════════ 상수 ═══════════ */
const DOW = ["일","월","화","수","목","금","토"];
const WEEK_COLS = [1,2,3,4,5,6,0];              /* 월 → 일 */
const colOffset = d => (d.getDay() + 6) % 7;    /* 월요일 = 0 */
const CATS = ["업무","개인"];
const KINDS = ["event","task"];
const KIND_LABEL = {event:"일정", task:"할일"};
const NOTE_KINDS = ["정보","아이디어","회의","일기","대화","기타"];
const STATUSES = ["open","done","moved","deleted"];
const MODES = ["day","week","month","note","prj","habit"];
const catCls = c => (c === "개인" ? "cat-p" : "cat-w");

const FIXED_HOL = {"01-01":"신정","03-01":"삼일절","05-05":"어린이날","06-06":"현충일",
  "08-15":"광복절","10-03":"개천절","10-09":"한글날","12-25":"성탄절"};
const LUNAR_HOL = {"2026-02-16":"설날 연휴","2026-02-17":"설날","2026-02-18":"설날 연휴",
  "2026-05-24":"부처님오신날","2026-09-24":"추석 연휴","2026-09-25":"추석","2026-09-26":"추석 연휴"};

const SVG_CHECK = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.4 7.4 5.6 10.6 11.6 3.6"/></svg>';
const SVG_ARROW = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 7h9.4M8 3.8 11.2 7 8 10.2"/></svg>';
const SVG_X = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3.4 3.4 10.6 10.6M10.6 3.4 3.4 10.6"/></svg>';
const SVG_PEN = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.6 1.9 12.1 4.4 4.6 11.9 1.6 12.4 2.1 9.4z"/></svg>';

/* ═══════════ 날짜/시간 ═══════════ */
const pad = n => String(n).padStart(2,"0");
const key = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const TODAY = key(new Date());
const holiday = k => LUNAR_HOL[k] || FIXED_HOL[k.slice(5)] || null;
const addDays = (k,n) => { const d = fromKey(k); d.setDate(d.getDate()+n); return key(d); };
const labelKo = k => { const d = fromKey(k); return (d.getMonth()+1) + "월 " + d.getDate() + "일"; };
const shortKo = k => { const d = fromKey(k); return (d.getMonth()+1) + "." + d.getDate(); };
const toMin = t => { if(!t) return 0; const [h,m] = t.split(":").map(Number); return h*60 + (m||0); };
const toHM = n => { n = Math.max(0, Math.min(1439, Math.round(n))); return pad(Math.floor(n/60)) + ":" + pad(n%60); };
function hourLabel(h){ return {ap: h < 12 ? "오전" : "오후", n: h % 12 === 0 ? 12 : h % 12}; }
function dayOfYear(k){ const d = fromKey(k); return Math.round((d - new Date(d.getFullYear(),0,1)) / 86400000) + 1; }
function daysInYear(k){ const y = fromKey(k).getFullYear(); return ((y%4===0 && y%100!==0) || y%400===0) ? 366 : 365; }
function weekStart(k){ return addDays(k, -colOffset(fromKey(k))); }
function weekDays(k){ const st = weekStart(k); return Array.from({length:7}, (_,i) => addDays(st, i)); }
function weekNo(k){
  const d = fromKey(k), jan1 = new Date(d.getFullYear(), 0, 1);
  const first = new Date(jan1); first.setDate(1 - colOffset(jan1));
  return Math.floor((d - first) / (7 * 86400000)) + 1;
}
function monthDays(mon){ const [y,m] = mon.split("-").map(Number); return new Date(y, m, 0).getDate(); }
const monthKey = (mon,i) => mon + "-" + pad(i);

/* ═══════════ 상태 ═══════════ */
const LS = "haru-record-v2";
const blank = () => ({items:{}, notes:{}, habits:[], habitLog:{}, metrics:{}, projects:[], view:{}, updatedAt:0});
let S, dirty=false, keeping=false, artifactApi=null, downloadsApi=null;
let wideRange = false;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const composing = e => e.isComposing || e.keyCode === 229;

function pushTo(bag, k, v){ (bag[k] = bag[k] || []).push(v); }
function migrate(st){
  if(!Array.isArray(st.habits)) st.habits = [];
  if(!Array.isArray(st.projects)) st.projects = [];
  st.habitLog = st.habitLog || {};
  st.metrics = st.metrics || {};
  st.habits = st.habits.map(h => {
    let fields = Array.isArray(h.fields) ? h.fields : null;
    if(!fields){
      if(h.type === "bp") fields = [{label:"수축", unit:"mmHg", dec:0},
                                    {label:"이완", unit:"mmHg", dec:0},
                                    {label:"심박", unit:"bpm", dec:0}];
      else if(h.type === "num") fields = [{label:"", unit:h.unit || "",
                                          dec: typeof h.dec === "number" ? h.dec : 1}];
      else fields = [];
    }
    return {id: h.id || uid(), name: h.name || "",
            fields: fields.map(f => ({label:f.label || "", unit:f.unit || "",
                                      dec: typeof f.dec === "number" ? f.dec : 1}))};
  });
  Object.keys(st.metrics).forEach(k => {
    const bag = st.metrics[k];
    Object.keys(bag).forEach(id => {
      const v = bag[id];
      if(Array.isArray(v)) return;
      if(v && typeof v === "object") bag[id] = [v.s, v.d, v.p].map(x => (x === "" || x == null) ? null : Number(x));
      else bag[id] = [(v === "" || v == null) ? null : Number(v)];
    });
  });
  if(!st.items){
    st.items = {};
    Object.keys(st.events || {}).forEach(k => (st.events[k]||[]).forEach(e => {
      const s0 = e.time || "";
      pushTo(st.items, k, {id:e.id || uid(), kind:"event", cat:"업무", title:e.title || "",
        allDay: !s0, start:s0, end: s0 ? toHM(toMin(s0) + 60) : "", endDate:k, status:"open"});
    }));
    Object.keys(st.todos || {}).forEach(k => (st.todos[k]||[]).forEach(t => {
      pushTo(st.items, k, {id:t.id || uid(), kind:"task", cat: CATS.indexOf(t.cat) >= 0 ? t.cat : "업무",
        title:t.text || "", allDay:true, start:"", end:"", endDate:k,
        status: STATUSES.indexOf(t.status) >= 0 ? t.status : (t.status === "doing" ? "open" : "open")});
    }));
  }
  if(!st.notes){
    st.notes = {};
    Object.keys(st.diary || {}).forEach(k => {
      const d = st.diary[k] || {};
      const txt = [(d.vow||"").trim(), (d.text||"").trim()].filter(Boolean).join("\n\n");
      const ph = (st.photos || {})[k] || [];
      if(txt || ph.length) pushTo(st.notes, k, {id:uid(), cat:"개인", kind:"일기", text:txt, photos:ph, at:""});
    });
  }
  delete st.events; delete st.todos; delete st.diary; delete st.photos; delete st.expenses;
  Object.keys(st.items).forEach(k => {
    st.items[k] = (st.items[k]||[]).map(it => ({
      id: it.id || uid(),
      kind: KINDS.indexOf(it.kind) >= 0 ? it.kind : "event",
      cat: CATS.indexOf(it.cat) >= 0 ? it.cat : "업무",
      title: it.title || "",
      allDay: !!it.allDay,
      start: it.start || "", end: it.end || "",
      endDate: it.endDate || k,
      status: STATUSES.indexOf(it.status) >= 0 ? it.status : "open"
    }));
  });
  Object.keys(st.notes).forEach(k => {
    st.notes[k] = (st.notes[k]||[]).map(n => ({
      id: n.id || uid(),
      cat: CATS.indexOf(n.cat) >= 0 ? n.cat : "업무",
      kind: NOTE_KINDS.indexOf(n.kind) >= 0 ? n.kind : "기타",
      text: n.text || "", photos: Array.isArray(n.photos) ? n.photos : [], at: n.at || ""
    }));
  });
  return st;
}
async function loadState(){
  let embedded = blank();
  try { embedded = Object.assign(blank(), await decJSON($("app-state").textContent)); } catch(e){}
  let local = null;
  try { const raw = localStorage.getItem(LS); if(raw) local = await decJSON(raw); } catch(e){}
  if(local && (local.updatedAt||0) > (embedded.updatedAt||0)){ S = Object.assign(blank(), local); dirty = true; }
  else { S = embedded; }
  migrate(S);
  S.view = S.view || {};
  if(!S.view.selected) S.view.selected = TODAY;
  if(MODES.indexOf(S.view.mode) < 0) S.view.mode = "day";
  S.view.month = S.view.selected.slice(0,7);
  S.view.q = ""; S.view.nfCat = S.view.nfCat || "전체"; S.view.nfKind = S.view.nfKind || "전체";
  if(S.view.wkView !== "list") S.view.wkView = "time";
  if(["전체","업무","개인"].indexOf(S.view.wkCat) < 0) S.view.wkCat = "전체";
  if(["전체","업무","개인"].indexOf(S.view.prjCat) < 0) S.view.prjCat = "전체";
  if(["month","3m","6m","all"].indexOf(S.view.hbRange) < 0) S.view.hbRange = "month";
  if(!dirty) await saveLocal();
}
async function saveLocal(){
  try { localStorage.setItem(LS, await encJSON(S)); } catch(e){}
}
function touch(){
  S.updatedAt = Date.now(); dirty = true;
  saveLocal();
  renderSave();
  schedulePush();
}

/* ═══════════ 접근자 ═══════════ */
const rawItems = k => S.items[k] || [];
const notesOn = k => S.notes[k] || [];
const habits = () => (S.habits = S.habits || []);
const projects = () => (S.projects = S.projects || []);
/* 제목/본문 맨 앞 [대괄호]가 프로젝트 */
function projectOf(text){
  const m = (text || "").trim().match(/^[\[(]\s*([^\])\n]{1,24})\s*[\])]/);
  return m ? m[1].trim() : null;
}
function findProject(name){ return projects().find(p => p.name === name) || null; }
function dDays(due){ return Math.round((fromKey(due) - fromKey(TODAY)) / 86400000); }
function dLabel(due){
  const n = dDays(due);
  return n === 0 ? "D-day" : n > 0 ? "D-" + n : "D+" + (-n);
}
function prjDone(name, st){
  const p = findProject(name);
  if(p && typeof p.done === "boolean") return p.done;
  const s2 = st || projectStats(name);
  return s2.items.length > 0 && s2.items.every(x => x.it.status === "done");
}
function ensureProject(text, cat){
  const n = projectOf(text);
  if(n && !findProject(n)) projects().push({id:uid(), name:n, cat: cat || "업무"});
  return n;
}
/* scope: "keep" 프로젝트만 · "future" 오늘 이후 일정까지 · "all" 전부 */
function deleteProject(name, scope){
  const isP = t => projectOf(t) === name;
  if(scope === "all" || scope === "future"){
    Object.keys(S.items).forEach(k => {
      S.items[k] = (S.items[k]||[]).filter(it => {
        if(!isP(it.title)) return true;
        if(scope === "all") return false;
        return k <= TODAY;
      });
      if(!S.items[k].length) delete S.items[k];
    });
  }
  if(scope === "all"){
    Object.keys(S.notes).forEach(k => {
      S.notes[k] = (S.notes[k]||[]).filter(n => !isP(n.text));
      if(!S.notes[k].length) delete S.notes[k];
    });
  }
  const strip = t => isP(t) ? (stripPrj(t).trim() || "제목 없음") : t;
  Object.keys(S.items).forEach(k => (S.items[k]||[]).forEach(it => { it.title = strip(it.title); }));
  Object.keys(S.notes).forEach(k => (S.notes[k]||[]).forEach(n => { n.text = strip(n.text); }));
  S.projects = projects().filter(x => x.name !== name);
}
function projectCounts(name){
  const st = projectStats(name);
  return {items: st.items.length, notes: st.notes.length,
          future: st.items.filter(x => x.k > TODAY).length};
}
function renameProject(oldName, newName){
  const swap = t => {
    const n = projectOf(t);
    if(n !== oldName) return t;
    return t.replace(/^[\[(]\s*[^\])\n]{1,24}\s*[\])]/, "[" + newName + "]");
  };
  Object.keys(S.items).forEach(k => (S.items[k]||[]).forEach(it => { it.title = swap(it.title); }));
  Object.keys(S.notes).forEach(k => (S.notes[k]||[]).forEach(n => { n.text = swap(n.text); }));
  const p = findProject(oldName); if(p) p.name = newName;
}
function projectStats(name){
  const st = {items:[], notes:[], mins:0, done:0, first:null, last:null};
  Object.keys(S.items).forEach(k => (S.items[k]||[]).forEach(it => {
    if(projectOf(it.title) !== name || !live(it)) return;
    st.items.push({k, it});
    st.mins += durMin(it);
    if(it.status === "done") st.done++;
    const end = (it.allDay && it.endDate && it.endDate > k) ? it.endDate : k;
    if(!st.first || k < st.first) st.first = k;
    if(!st.last || end > st.last) st.last = end;
  }));
  Object.keys(S.notes).forEach(k => (S.notes[k]||[]).forEach(n => {
    if(projectOf(n.text) !== name) return;
    st.notes.push({k, n});
    if(!st.first || k < st.first) st.first = k;
    if(!st.last || k > st.last) st.last = k;
  }));
  st.items.sort((a,b) => a.k < b.k ? 1 : a.k > b.k ? -1 : 0);
  st.notes.sort((a,b) => a.k < b.k ? 1 : a.k > b.k ? -1 : 0);
  return st;
}
/* 목록에 없더라도 실제 쓰인 프로젝트는 모두 모은다 */
function allProjectNames(){
  const set = new Set(projects().map(p => p.name));
  Object.keys(S.items).forEach(k => (S.items[k]||[]).forEach(it => {
    const n = projectOf(it.title); if(n) set.add(n);
  }));
  Object.keys(S.notes).forEach(k => (S.notes[k]||[]).forEach(x => {
    const n = projectOf(x.text); if(n) set.add(n);
  }));
  return Array.from(set);
}
const logOf = k => S.habitLog[k] || [];
const hasHabit = (k,id) => logOf(k).indexOf(id) >= 0;
const numHabits = () => habits().filter(h => h.fields && h.fields.length);
const metOf = k => S.metrics[k] || {};
const metVals = (k, id) => { const v = metOf(k)[id]; return Array.isArray(v) ? v : []; };
function setMetricField(k, id, idx, raw){
  const bag = S.metrics[k] = S.metrics[k] || {};
  const arr = Array.isArray(bag[id]) ? bag[id].slice() : [];
  arr[idx] = (raw === "" || raw === null || raw === undefined) ? null : Number(raw);
  if(arr.every(x => x === null || x === undefined || !isFinite(x))) delete bag[id];
  else bag[id] = arr;
  if(!Object.keys(bag).length) delete S.metrics[k];
}
function metricSeries(h, from, to){
  const out = [];
  Object.keys(S.metrics).sort().forEach(k => {
    if(k < from || k > to) return;
    const raw = metVals(k, h.id);
    if(!raw.length) return;
    const vals = h.fields.map((f,i) => { const n = Number(raw[i]); return isFinite(n) ? n : null; });
    if(vals.every(x => x === null)) return;
    out.push({k, vals});
  });
  return out;
}
const fmtNum = (n, dec) => (n === null || n === undefined || !isFinite(n)) ? "–"
  : (Math.round(n * Math.pow(10, dec)) / Math.pow(10, dec)).toLocaleString("ko-KR");
function rangeOf(){
  const r = S.view.hbRange || "month";
  if(r === "month") return [monthKey(S.view.month,1), monthKey(S.view.month, monthDays(S.view.month))];
  const to = TODAY;
  const back = r === "3m" ? 92 : r === "6m" ? 183 : 100000;
  if(r === "all"){
    let first = TODAY;
    Object.keys(S.habitLog).forEach(k => { if(k < first) first = k; });
    Object.keys(S.metrics).forEach(k => { if(k < first) first = k; });
    return [first, to];
  }
  return [addDays(to, -back + 1), to];
}
const live = it => it.status !== "deleted";

/* 그 날짜에 걸치는 모든 항목 (여러 날 종일 포함). ownerKey = 실제 저장된 날짜 */
function itemsOn(k){
  const out = rawItems(k).map(it => ({it, ok:k}));
  Object.keys(S.items).forEach(sk => {
    if(sk >= k) return;
    rawItems(sk).forEach(it => {
      if(it.allDay && it.endDate && it.endDate >= k) out.push({it, ok:sk, span:true});
    });
  });
  return out;
}
function findItem(ok, id){ return rawItems(ok).find(x => x.id === id) || null; }
function removeItem(ok, id){
  S.items[ok] = rawItems(ok).filter(x => x.id !== id);
  if(!S.items[ok].length) delete S.items[ok];
}
function moveItemTo(ok, id, newKey){
  const it = findItem(ok, id); if(!it) return;
  removeItem(ok, id);
  pushTo(S.items, newKey, it);
  if(it.allDay){
    const span = Math.max(0, Math.round((fromKey(it.endDate) - fromKey(ok)) / 86400000));
    it.endDate = addDays(newKey, span);
  } else it.endDate = newKey;
}

/* ═══════════ 시간표 배치 ═══════════ */
const PX_H = 40;
function gridRange(){ return wideRange ? [5, 23] : [7, 22]; }
function packTimed(list){
  const its = list.map(o => {
    const s = toMin(o.it.start);
    const e = Math.max(toMin(o.it.end || o.it.start), s + 30);
    return {o, s, e};
  }).sort((a,b) => a.s - b.s || a.e - b.e);
  let cur = [], curEnd = -1;
  const clusters = [];
  its.forEach(x => {
    if(cur.length && x.s >= curEnd){ clusters.push(cur); cur = []; curEnd = -1; }
    cur.push(x); curEnd = Math.max(curEnd, x.e);
  });
  if(cur.length) clusters.push(cur);
  clusters.forEach(cl => {
    const colEnd = [];
    cl.forEach(x => {
      let c = 0;
      while(colEnd[c] !== undefined && colEnd[c] > x.s) c++;
      x.col = c; colEnd[c] = x.e;
    });
    cl.forEach(x => { x.cols = colEnd.length; });
  });
  return its;
}

/* ═══════════ 렌더 ═══════════ */
function render(){
  renderNav();
  const m = S.view.mode;
  if(m === "day") renderDaily();
  else if(m === "week") renderWeekly();
  else if(m === "month") renderMonthly();
  else if(m === "note") renderNotes();
  else if(m === "prj") renderProjects();
  else renderHabitTab();
  renderSave();
}
function renderSave(){
  const t = $("savetext"), dot = $("dot"), keep = $("keep");
  if(sync.on){
    keep.hidden = !artifactApi;
    if(artifactApi) keep.disabled = !dirty;
    const ago = syncAt ? Math.round((Date.now() - syncAt) / 60000) : null;
    if(syncState === "error" || syncState === "conflict"){
      t.textContent = (syncState === "conflict" ? "충돌 — 지금 동기화를 눌러 주세요" : "동기화 실패");
      dot.className = "dotpulse dirty";
    } else if(syncState === "pushing" || syncState === "pulling"){
      t.textContent = syncLabel(); dot.className = "dotpulse";
    } else {
      t.textContent = "동기화됨" + (ago !== null && ago > 0 ? " · " + ago + "분 전" : "");
      dot.className = "dotpulse";
    }
    return;
  }
  if(keeping){ t.textContent = "보관 중…"; dot.className = "dotpulse"; keep.disabled = true; return; }
  if(!artifactApi){ t.textContent = "이 브라우저에 저장됨"; dot.className = "dotpulse"; keep.hidden = true; return; }
  keep.hidden = false;
  if(dirty){ t.textContent = "보관 전 변경 있음"; dot.className = "dotpulse dirty"; keep.disabled = false; }
  else { t.textContent = "모두 보관됨"; dot.className = "dotpulse"; keep.disabled = true; }
}
function renderNav(){
  const m = S.view.mode, k = S.view.selected, d = fromKey(k);
  MODES.forEach(x => $("tab-" + x).setAttribute("aria-selected", x === m ? "true" : "false"));
  const nav = (m === "day" || m === "week" || m === "month");
  $("prev").hidden = !nav; $("next").hidden = !nav;
  $("today").hidden = !nav;

  let cls = "pagehead", big = "", title = "", meta = "";
  if(m === "day"){
    const hol = holiday(k);
    cls += " s" + d.getDay() + (hol ? " hol" : "");
    big = String(d.getDate());
    title = d.getFullYear() + "년 " + labelKo(k) + " " + DOW[d.getDay()] + "요일" + (hol ? " · " + hol : "");
    meta = weekNo(k) + "주차 · 올해 " + dayOfYear(k) + "일째 · " + (daysInYear(k) - dayOfYear(k)) + "일 남음";
  } else if(m === "week"){
    const days = weekDays(k);
    big = weekNo(days[0]) + '<em>주</em>';
    title = labelKo(days[0]) + " – " + labelKo(days[6]);
    meta = fromKey(days[0]).getFullYear() + "년 " + weekNo(days[0]) + "주차";
  } else if(m === "month"){
    const [y,mm] = S.view.month.split("-").map(Number);
    big = mm + '<em>월</em>';
    title = y + "년 " + mm + "월";
    meta = monthDays(S.view.month) + "일" + (S.view.month === TODAY.slice(0,7) ? " · 오늘 " + Number(TODAY.slice(8)) + "일째" : "");
  } else if(m === "note"){
    let n = 0; Object.keys(S.notes).forEach(x => n += notesOn(x).length);
    big = n + '<em>건</em>'; title = "기록 모아보기"; meta = "업무·개인, 갈래별로 나눠 봅니다";
  } else if(m === "prj"){
    big = allProjectNames().length + '<em>개</em>'; title = "프로젝트";
    meta = "제목 앞 [이름] 으로 묶입니다";
  } else {
    big = habits().length + '<em>개</em>'; title = "습관 관리"; meta = "여기서 추가하고 지웁니다";
  }
  $("pagehead").className = cls;
  $("phmain").innerHTML = '<div class="bignum">' + big + '</div>'
    + '<div class="pagemeta"><b>' + esc(title) + '</b><span>' + esc(meta) + '</span></div>';
  renderMini();
}
function renderMini(){
  const host = $("minihost"), m = S.view.mode;
  if(m !== "day" && m !== "week"){ host.innerHTML = ""; return; }
  host.innerHTML = miniMonth();
  host.querySelectorAll("[data-k]").forEach(b => { b.onclick = () => select(b.dataset.k); });
  const hop = n => {
    const [y,mm] = S.view.month.split("-").map(Number);
    const d = new Date(y, mm-1+n, 1);
    S.view.month = d.getFullYear() + "-" + pad(d.getMonth()+1);
    renderMini();
  };
  const mp = host.querySelector('[data-act="mprev"]'), mn = host.querySelector('[data-act="mnext"]');
  if(mp) mp.onclick = () => hop(-1);
  if(mn) mn.onclick = () => hop(1);
}
function miniMonth(){
  const [y,m] = S.view.month.split("-").map(Number);
  const first = new Date(y,m-1,1), start = new Date(first);
  start.setDate(1 - colOffset(first));
  const wk = S.view.mode === "week" ? weekDays(S.view.selected) : null;
  let h = '<div class="mh"><button data-act="mprev" aria-label="이전 달">&#8249;</button>'
    + '<b>' + y + "." + pad(m) + '</b>'
    + '<button data-act="mnext" aria-label="다음 달">&#8250;</button></div><div class="mgrid">';
  WEEK_COLS.forEach(i => { h += '<div class="hd s' + i + '">' + DOW[i] + '</div>'; });
  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const k = key(d), out = d.getMonth() !== m-1;
    const busy = itemsOn(k).filter(o => live(o.it)).length || notesOn(k).length;
    const cls = ["mc","s"+d.getDay()];
    if(out) cls.push("out");
    if(holiday(k)) cls.push("hol");
    if(wk && wk.indexOf(k) >= 0) cls.push("wk");
    if(k===TODAY) cls.push("today");
    if(!wk && k===S.view.selected) cls.push("sel");
    h += '<button class="' + cls.join(" ") + '" data-k="' + k + '">' + d.getDate()
      + (busy ? '<i></i>' : '') + '</button>';
  }
  return h + "</div>";
}

/* ═══════════ 일간 ═══════════ */
function renderDaily(){
  const k = S.view.selected;
  const all = itemsOn(k).filter(o => live(o.it) || o.it.status === "moved" || o.it.status === "done");
  const allDay = all.filter(o => o.it.allDay);
  const timed = all.filter(o => !o.it.allDay);
  const [from, to] = gridRange();
  const nowMin = (TODAY === k) ? (new Date().getHours()*60 + new Date().getMinutes()) : -1;

  /* 종일 줄 */
  let adHtml = '<div class="tgtop"><span class="lb">종일</span><div class="items">';
  allDay.forEach(o => {
    const it = o.it;
    const multi = it.endDate && it.endDate !== o.ok;
    adHtml += '<span class="adchip ' + catCls(it.cat) + ' ' + it.kind + ' ' + it.status
      + '" data-ok="' + o.ok + '" data-id="' + it.id + '">'
      + (multi ? '<small>' + shortKo(o.ok) + '–' + shortKo(it.endDate) + '</small>' : '')
      + '<span>' + esc(it.title) + '</span></span>';
  });
  adHtml += '<button class="plus" data-act="addallday" aria-label="종일 항목 추가" '
    + 'style="width:23px;height:23px;font-size:14px">+</button></div></div>';

  /* 시간 눈금 */
  let hoursHtml = '<div class="tghours">';
  for(let h = from; h <= to; h++){
    const {ap, n} = hourLabel(h);
    const showAp = (h === from) || (h === 12);
    hoursHtml += '<div class="tghour' + (Math.floor(nowMin/60) === h ? " now" : "") + '" style="height:' + PX_H + 'px">'
      + (showAp ? '<span class="ap">' + ap + '</span>' : '') + '<b>' + n + '</b></div>';
  }
  hoursHtml += '</div>';

  /* 항목 */
  const packed = packTimed(timed);
  const top0 = from * 60, height = (to - from + 1) * PX_H;
  let itemsHtml = '';
  packed.forEach(x => {
    const it = x.o.it;
    const t = (x.s - top0) / 60 * PX_H;
    const hgt = Math.max(18, (x.e - x.s) / 60 * PX_H - 2);
    const w = 100 / x.cols, l = x.col * w;
    itemsHtml += '<div class="tgitem ' + catCls(it.cat) + ' ' + it.kind + ' ' + it.status
      + (hgt < 34 ? ' short' : '') + '" data-ok="' + x.o.ok + '" data-id="' + it.id + '"'
      + ' style="top:' + t.toFixed(1) + 'px;height:' + hgt.toFixed(1) + 'px;'
      + 'left:calc(' + l + '% + 3px);width:calc(' + w + '% - 6px)">'
      + '<b>' + it.start + (it.end ? '–' + it.end : '') + '</b>'
      + '<span>' + esc(it.title) + '</span></div>';
  });
  const nowLine = (nowMin >= top0 && nowMin <= (to+1)*60)
    ? '<div class="tgnow" style="top:' + ((nowMin - top0)/60*PX_H).toFixed(1) + 'px"></div>' : '';

  const nTask = all.filter(o => o.it.kind === "task" && live(o.it)).length;
  const nEv = all.filter(o => o.it.kind === "event" && live(o.it)).length;

  let h = '<div class="daygrid"><div class="panel" style="min-height:100%">'
    + '<div class="ph"><h3>예정일정</h3><span class="sp"></span>'
    + '<em>일정 ' + nEv + ' · 할일 ' + nTask + '</em></div>'
    + adHtml
    + '<div class="tgwrap">' + hoursHtml
    + '<div class="tgcanvas" id="tgcanvas" style="height:' + height + 'px">' + nowLine + itemsHtml + '</div>'
    + '</div>'
    + '<div class="tgfoot"><button id="widen">' + (wideRange ? "이른·늦은 시간 접기" : "이른 시간 · 늦은 시간 펼치기") + '</button>'
    + '<span class="sp"></span><button id="addbtn">+ 새 항목</button></div></div>';

  /* 오른쪽 */
  h += '<div class="colstack">' + habitStrip(k) + noteBlock(k) + '</div></div>';

  $("view").innerHTML = h;
  bindDaily();
}

function habitStrip(k){
  const hb = habits();
  const done = hb.filter(x => hasHabit(k, x.id)).length;
  let h = '<div class="panel"><div class="ph"><h3>오늘의 습관</h3><span class="sp"></span>'
    + (hb.length ? '<em>' + done + '/' + hb.length + '</em>' : '') + '</div>';
  if(!hb.length) return h + '<div class="hbnone"><span class="empty">습관 탭에서 먼저 추가해 주세요.</span></div></div>';
  h += '<div class="hbrows">';
  hb.forEach(x => {
    const on = hasHabit(k, x.id), vals = metVals(k, x.id);
    h += '<div class="hbline">'
      + '<button class="hbtog' + (on ? " on" : "") + '" data-h="' + x.id + '" role="checkbox"'
      + ' aria-checked="' + (on?"true":"false") + '"><i>' + SVG_CHECK + '</i>' + esc(x.name) + '</button>';
    (x.fields || []).forEach((f, i) => {
      const v = vals[i];
      h += (i > 0 ? '<span class="msep">/</span>' : '')
        + '<input type="number" step="any" class="f mval" data-h="' + x.id + '" data-i="' + i
        + '" placeholder="' + esc(f.label || "값") + '" title="' + esc(f.label || x.name) + '" value="'
        + (v === null || v === undefined || !isFinite(v) ? "" : v) + '">'
        + (f.unit ? '<span class="munit">' + esc(f.unit) + '</span>' : '');
    });
    h += '</div>';
  });
  return h + '</div></div>';
}

        + '</div><div class="kindpick" id="ne-kind">'

            + (noteEdit.kind === x ? "true" : "false") + '">' + x + '</button>').join("")
        + '</div></div>'

      + '<button class="ntrm" data-act="ntedit" aria-label="기록 고치기">' + SVG_PEN + '</button>'

function shotsBlock(photos, owner){
  if(!photos || !photos.length) return "";
  return '<div class="shots" data-owner="' + owner + '">' + photos.map((x,i) =>
    '<div class="shot" data-id="' + x.id + '" role="button" tabindex="0" aria-label="사진 ' + (i+1) + '">'
    + '<img src="' + x.src + '" alt="사진 ' + (i+1) + '">'
    + '<button class="x" data-act="rmshot" aria-label="사진 지우기">&times;</button></div>').join("") + '</div>';
}

/* ═══════════ 일간 바인딩 ═══════════ */
let noteDraft = {cat:"업무", kind:"정보", text:"", photos:[]};
let noteEdit = null;
let clickGuardUntil = 0;

function bindDaily(){
  const k = S.view.selected, view = $("view");
  const [from] = gridRange();

  $("widen").onclick = () => { wideRange = !wideRange; renderDaily(); };
  $("addbtn").onclick = () => openItemModal(k, null, null, null);
  const addAd = view.querySelector('[data-act="addallday"]');
  if(addAd) addAd.onclick = () => openItemModal(k, null, null, {allDay:true});

  /* 빈 곳 클릭 → 추가 */
  const canvas = $("tgcanvas");
  canvas.onclick = e => {
    if(e.target !== canvas) return;
    const r = canvas.getBoundingClientRect();
    const min = Math.round(((e.clientY - r.top) / PX_H * 60 + from * 60) / 30) * 30;
    openItemModal(k, null, null, {start: toHM(min), end: toHM(min + 60)});
  };

  /* 시간 항목 */
  view.querySelectorAll(".tgitem").forEach(el => {
    const ok = el.dataset.ok, id = el.dataset.id;
    bindItemActions(el, ok, id);
    el.onpointerdown = e => {
      if(e.button !== 0) return;
      const it = findItem(ok, id); if(!it || it.allDay) return;
      const startY = e.clientY;
      const orig = toMin(it.start), dur = Math.max(30, toMin(it.end || it.start) - orig);
      const [f2, t2] = gridRange(), top0 = f2 * 60;
      let moved = false, ns = orig;
      try { el.setPointerCapture(e.pointerId); } catch(err){}
      const label = el.querySelector("b");
      const onMove = ev => {
        const dy = ev.clientY - startY;
        if(!moved && Math.abs(dy) < 4) return;
        moved = true; el._dragged = true; el.classList.add("dragging");
        const delta = Math.round(dy / PX_H * 60 / 15) * 15;
        ns = Math.max(top0, Math.min((t2 + 1) * 60 - dur, orig + delta));
        el.style.top = ((ns - top0) / 60 * PX_H).toFixed(1) + "px";
        if(label) label.textContent = toHM(ns) + "–" + toHM(ns + dur);
      };
      const onUp = () => {
        el.onpointermove = null; el.onpointerup = null; el.onpointercancel = null;
        el.classList.remove("dragging");
        if(!moved) return;
        clickGuardUntil = Date.now() + 400;
        const cur = findItem(ok, id); if(!cur) return;
        cur.start = toHM(ns); cur.end = toHM(ns + dur);
        touch(); renderDaily();
      };
      el.onpointermove = onMove; el.onpointerup = onUp; el.onpointercancel = onUp;
    };
  });

  /* 종일 항목 */
  view.querySelectorAll(".adchip").forEach(el => bindItemActions(el, el.dataset.ok, el.dataset.id));

  /* 습관 */
  view.querySelectorAll(".hbtog").forEach(b => {
    b.onclick = () => { toggleHabit(k, b.dataset.h); touch(); renderDaily(); renderMini(); };
  });
  view.querySelectorAll(".mval").forEach(inp => {
    inp.oninput = () => {
      const id = inp.dataset.h;
      setMetricField(k, id, Number(inp.dataset.i), inp.value);
      if(inp.value !== "" && !hasHabit(k, id)){
        toggleHabit(k, id);
        const tog = view.querySelector('.hbtog[data-h="' + id + '"]');
        if(tog){ tog.classList.add("on"); tog.setAttribute("aria-checked", "true"); }
      }
      touch();
    };
  });

  bindNoteForm(k);
}

function bindItemActions(el, ok, id){
  el.onclick = e => {
    if(el._dragged || Date.now() < clickGuardUntil){ el._dragged = false; return; }
    e.preventDefault(); e.stopPropagation();
    openItemModal(ok, ok, id, null);
  };
  el.ondblclick = e => { e.preventDefault(); e.stopPropagation(); };
  el.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); openCMenu(e.clientX, e.clientY, ok, id); };
  el.style.cursor = el.classList.contains("wlrow") ? "pointer" : el.style.cursor;
}

/* ═══════════ 우클릭 메뉴 ═══════════ */
function closeCMenu(){ const m = $("cmenu"); if(m) m.remove(); }
function openCMenu(x, y, ok, id){
  closeCMenu();
  const it = findItem(ok, id); if(!it) return;
  const el = document.createElement("div");
  el.className = "cmenu"; el.id = "cmenu";
  el.innerHTML = '<div class="head">' + esc(it.title || "(제목 없음)") + '</div>'
    + '<button data-a="done">' + SVG_CHECK + (it.status === "done" ? "완료 해제" : "완료") + '</button>'
    + '<button data-a="edit">' + SVG_PEN + '수정</button>'
    + '<div class="sep"></div>'
    + '<div class="head">' + SVG_ARROW.replace("14 14","14 14") + ' 연기 — 옮길 곳</div>'
    + '<div class="row"><input type="date" class="f" id="cm-date" value="' + addDays(ok,1) + '" style="flex:1">'
    + (it.allDay ? '' : timeField("cm-time", it.start || "09:00", 96))
    + '</div><div class="row"><button class="btn" id="cm-move" style="flex:1">연기하기</button></div>'
    + '<div class="sep"></div>'
    + '<button data-a="del" class="danger">' + SVG_X + '삭제</button>';
  document.body.appendChild(el);
  bindTimeFields(el);
  const r = el.getBoundingClientRect();
  el.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + "px";
  el.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + "px";

  el.onclick = e => {
    const b = e.target.closest("button[data-a]");
    if(!b) return;
    const a = b.dataset.a, cur = findItem(ok, id);
    if(!cur) { closeCMenu(); return; }
    if(a === "done"){ cur.status = cur.status === "done" ? "open" : "done"; touch(); }
    else if(a === "edit"){ closeCMenu(); openItemModal(S.view.selected, ok, id, null); return; }
    else if(a === "del"){ removeItem(ok, id); touch(); }
    closeCMenu(); render();
  };
  $("cm-move").onclick = () => {
    const cur = findItem(ok, id); if(!cur){ closeCMenu(); return; }
    const nk = $("cm-date").value;
    if(!nk){ toast("옮길 날짜를 골라 주세요"); return; }
    const t = $("cm-time") ? $("cm-time").value : "";
    const dur = cur.allDay ? 0 : Math.max(30, toMin(cur.end || cur.start) - toMin(cur.start));
    const copy = Object.assign({}, cur, {id:uid(), status:"open", endDate:nk});
    if(!cur.allDay && t){ copy.start = t; copy.end = toHM(toMin(t) + dur); }
    if(cur.allDay){
      const span = Math.max(0, Math.round((fromKey(cur.endDate) - fromKey(ok)) / 86400000));
      copy.endDate = addDays(nk, span);
    }
    cur.status = "moved";
    pushTo(S.items, nk, copy);
    touch(); closeCMenu(); render();
    toast(labelKo(nk) + (copy.start ? " " + copy.start : "") + "로 연기했습니다");
  };
  setTimeout(() => {
    const off = ev => { if(!el.contains(ev.target)){ closeCMenu(); document.removeEventListener("pointerdown", off, true); } };
    document.addEventListener("pointerdown", off, true);
  }, 0);
}

/* ═══════════ 항목 등록/수정 모달 ═══════════ */
function openItemModal(dateKey, ok, id, preset){
  closeCMenu();
  if($("scrim")) return;
  const editing = !!id;
  const src = editing ? findItem(ok, id) : null;
  const d = {
    kind: src ? src.kind : "event",
    cat: src ? src.cat : "업무",
    title: src ? src.title : "",
    allDay: src ? src.allDay : (preset && preset.allDay ? true : false),
    start: src ? src.start : (preset && preset.start ? preset.start : "09:00"),
    end: src ? src.end : (preset && preset.end ? preset.end : "10:00"),
    from: ok || dateKey,
    to: src ? (src.endDate || ok) : dateKey
  };
  const scrim = document.createElement("div");
  scrim.className = "scrim"; scrim.id = "scrim";
  const draw = () => {
    scrim.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'
      + '<div class="mdhead"><h4>' + (editing ? "항목 수정" : "새 항목") + '</h4><span class="sp"></span>'
      + '<span class="tag kindtag">' + labelKo(d.from) + '</span></div>'
      + '<div class="mdbody">'
      + '<div class="fld"><label>구분</label><div class="frow"><div class="pick" id="md-kind">'
      + KINDS.map(x => '<button data-x="' + x + '" aria-pressed="' + (d.kind===x?"true":"false") + '">'
          + KIND_LABEL[x] + '</button>').join("") + '</div>'
      + '<div class="pick" id="md-cat">'
      + CATS.map(c => '<button class="' + catCls(c) + '" data-c="' + c + '" aria-pressed="'
          + (d.cat===c?"true":"false") + '">' + c + '</button>').join("") + '</div></div></div>'
      + '<div class="fld"><label>내용</label>'
      + '<input type="text" class="f" id="md-title" maxlength="160" placeholder="무엇인가요" value="' + esc(d.title) + '"></div>'
      + '<label class="chk"><input type="checkbox" id="md-allday"' + (d.allDay ? " checked" : "") + '>종일</label>'
      + (d.allDay
          ? '<div class="fld"><label>기간</label><div class="frow">'
            + '<input type="date" class="f" id="md-from" value="' + d.from + '"><span style="color:var(--ink-3)">–</span>'
            + '<input type="date" class="f" id="md-to" value="' + d.to + '"></div></div>'
          : '<div class="fld"><label>시각</label><div class="frow">'
            + '<input type="date" class="f" id="md-from" value="' + d.from + '"></div><div class="frow">'
            + timeField("md-start", d.start || "09:00") + '<span style="color:var(--ink-3)">–</span>'
            + timeField("md-end", d.end || "10:00") + '</div></div>')
      + '</div><div class="mdfoot">'
      + (editing ? '<button class="btn" id="md-del">삭제</button>' : '')
      + '<span class="sp"></span><button class="btn" id="md-cancel">취소</button>'
      + '<button class="btn primary" id="md-save">' + (editing ? "저장" : "추가") + '</button></div></div>';
    wire();
  };
  const grab = () => {
    const t = $("md-title"); if(t) d.title = t.value;
    const f = $("md-from"); if(f && f.value) d.from = f.value;
    const to = $("md-to"); if(to && to.value) d.to = to.value;
    const s = $("md-start"); if(s && s.value) d.start = s.value;
    const e = $("md-end"); if(e && e.value) d.end = e.value;
  };
  const wire = () => {
    scrim.querySelectorAll("#md-kind button").forEach(b => b.onclick = () => {
      grab(); d.kind = b.dataset.x; draw(); $("md-title").focus();
    });
    scrim.querySelectorAll("#md-cat button").forEach(b => b.onclick = () => {
      grab(); d.cat = b.dataset.c; draw(); $("md-title").focus();
    });
    $("md-allday").onchange = e => { grab(); d.allDay = e.target.checked; if(d.allDay) d.to = d.from; draw(); };
    const stEl = $("md-start"), enEl = $("md-end");
    if(stEl && enEl){
      let prevStart = stEl.value;
      stEl.addEventListener("change", () => {
        const dur = Math.max(15, toMin(enEl.value) - toMin(prevStart));
        const ns = toMin(stEl.value);
        enEl.value = toHM(Math.min(24 * 60 - 1, ns + dur));
        prevStart = stEl.value;
        d.start = stEl.value; d.end = enEl.value;
      });
      enEl.addEventListener("change", () => { d.end = enEl.value; });
    }
    const ac = attachProjectAC($("md-title"), () => d.cat);
    $("md-title").onkeydown = e => {
      if(ac.key(e)) return;
      if(composing(e)) return;
      if(e.key === "Enter"){ e.preventDefault(); save(); }
    };
    $("md-cancel").onclick = close;
    $("md-save").onclick = save;
    const del = $("md-del");
    if(del) del.onclick = () => { removeItem(ok, id); touch(); close(); render(); };
    bindTimeFields(scrim);
    setTimeout(() => { const t = $("md-title"); if(t) t.focus(); }, 10);
  };
  const close = () => { scrim.remove(); document.removeEventListener("keydown", onKey, true); };
  const onKey = e => {
    if(e.key === "Escape"){ e.stopPropagation(); close(); }
  };
  const save = () => {
    grab();
    const title = (d.title || "").trim();
    if(!title){ toast("내용을 적어 주세요"); const t = $("md-title"); if(t) t.focus(); return; }
    let toDate = d.allDay ? (d.to < d.from ? d.from : d.to) : d.from;
    let st = d.start, en = d.end;
    if(!d.allDay && toMin(en) <= toMin(st)) en = toHM(toMin(st) + 60);
    ensureProject(title, d.cat);
    const rec = {id: editing ? id : uid(), kind:d.kind, cat:d.cat, title,
      allDay:d.allDay, start: d.allDay ? "" : st, end: d.allDay ? "" : en,
      endDate: toDate, status: src ? src.status : "open"};
    if(editing){
      removeItem(ok, id);
      pushTo(S.items, d.from, rec);
    } else pushTo(S.items, d.from, rec);
    if(d.from !== S.view.selected && S.view.mode === "day") S.view.selected = d.from;
    touch(); close(); render();
  };
  const openedAt = Date.now();
  scrim.onclick = e => { if(e.target === scrim && Date.now() - openedAt > 350) close(); };
  document.addEventListener("keydown", onKey, true);
  document.body.appendChild(scrim);
  draw();
}
